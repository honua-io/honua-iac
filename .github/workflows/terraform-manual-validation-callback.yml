name: Terraform Manual Validation Callback

on:
  workflow_run:
    workflows:
      - Terraform Manual Validation
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    name: Notify Terraform Validation Completion
    runs-on: ubuntu-latest
    steps:
      - name: Collect run summary
        id: collect
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100
            });

            const jobs = data.jobs.map((job) => ({
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              started_at: job.started_at,
              completed_at: job.completed_at,
              html_url: job.html_url
            }));

            const interestingJobs = jobs.filter((job) => job.conclusion !== "skipped");
            const statusLines = interestingJobs.length > 0
              ? interestingJobs.map((job) => `- ${job.name}: ${job.conclusion || job.status}`)
              : ["- No non-skipped jobs recorded"];

            const payload = {
              repository: `${context.repo.owner}/${context.repo.repo}`,
              workflow: run.name,
              run_id: run.id,
              run_number: run.run_number,
              run_attempt: run.run_attempt,
              html_url: run.html_url,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_branch: run.head_branch,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              jobs
            };

            const commentLines = [
              `## Terraform Validation ${run.conclusion || run.status}`,
              ``,
              `- Run: [${run.id}](${run.html_url})`,
              `- Branch: \`${run.head_branch || "unknown"}\``,
              `- SHA: \`${run.head_sha}\``,
              `- Event: \`${run.event}\``,
              ``,
              `### Jobs`,
              ...statusLines
            ];

            core.setOutput("payload", JSON.stringify(payload));
            core.setOutput("comment", commentLines.join("\n"));

      - name: Comment on tracking issue
        if: vars.HONUA_VALIDATION_STATUS_ISSUE_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ vars.HONUA_VALIDATION_STATUS_ISSUE_NUMBER }}
          COMMENT_BODY: ${{ steps.collect.outputs.comment }}
        run: |
          set -euo pipefail
          tmp_file="$(mktemp)"
          printf '%s\n' "$COMMENT_BODY" > "$tmp_file"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$tmp_file"

      - name: Send outbound webhook
        if: secrets.HONUA_VALIDATION_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.HONUA_VALIDATION_WEBHOOK_URL }}
          WEBHOOK_BEARER_TOKEN: ${{ secrets.HONUA_VALIDATION_WEBHOOK_BEARER_TOKEN }}
          WEBHOOK_HMAC_SECRET: ${{ secrets.HONUA_VALIDATION_WEBHOOK_HMAC_SECRET }}
          PAYLOAD_JSON: ${{ steps.collect.outputs.payload }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.request

          payload = os.environ["PAYLOAD_JSON"].encode("utf-8")
          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=payload,
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "honua-terraform-validation-callback"
              },
          )

          bearer = os.environ.get("WEBHOOK_BEARER_TOKEN", "")
          if bearer:
            request.add_header("Authorization", f"Bearer {bearer}")

          secret = os.environ.get("WEBHOOK_HMAC_SECRET", "")
          if secret:
            digest = hmac.new(secret.encode("utf-8"), payload, hashlib.sha256).hexdigest()
            request.add_header("X-Honua-Signature-256", f"sha256={digest}")

          with urllib.request.urlopen(request, timeout=30) as response:
            if response.status < 200 or response.status >= 300:
              raise SystemExit(f"Webhook callback failed with HTTP {response.status}")
          PY
