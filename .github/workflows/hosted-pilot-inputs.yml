name: Hosted pilot foundation inputs
on:
  pull_request:
    paths:
      - certification/hosted-pilot/**
      - scripts/check-hosted-pilot-foundation-inputs.py
      - scripts/test-hosted-pilot-foundation-inputs.py
      - scripts/test-hosted-pilot-foundation-phase.py
      - .github/workflows/hosted-pilot-inputs.yml
      - .github/workflows/hosted-pilot-bootstrap.yml
  push:
    branches: [trunk]
    paths:
      - certification/hosted-pilot/**
      - scripts/check-hosted-pilot-foundation-inputs.py
      - scripts/test-hosted-pilot-foundation-inputs.py
      - scripts/test-hosted-pilot-foundation-phase.py
      - .github/workflows/hosted-pilot-inputs.yml
      - .github/workflows/hosted-pilot-bootstrap.yml
permissions:
  contents: read
jobs:
  exact-nonsecret-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-release
          ref: trunk
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install bounded workflow test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/foundation-phase-test"
          "$RUNNER_TEMP/foundation-phase-test/bin/pip" install --disable-pip-version-check PyYAML==6.0.3
      - name: Check exact phase separation and approval dependency graph
        run: '"$RUNNER_TEMP/foundation-phase-test/bin/python" scripts/test-hosted-pilot-foundation-phase.py -v'
      - name: Verify only reviewed inputs and reject changed funding or workload authority
        run: python3 scripts/test-hosted-pilot-foundation-inputs.py -v
      - name: Require exact reviewed release source and actual funding compiler
        run: python3 scripts/check-hosted-pilot-foundation-inputs.py --release-source release-source
      - name: Require matching protected release phase workflow contract
        run: cmp .github/workflows/hosted-pilot-bootstrap.yml release-source/certification/hosted-pilot/bootstrap/foundation-bootstrap-workflow.yml
