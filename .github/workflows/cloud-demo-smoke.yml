name: Honua Cloud Demo Smoke

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "honua-sdk-js ref to validate"
        required: true
        type: string
        default: trunk
      strict_env:
        description: "Fail when any seeded profile env required by the JS contract is missing"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: cloud-demo-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloud-demo-smoke:
    name: JS Cloud Demo Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HONUA_CLOUD_DEMO_BASE_URL: ${{ vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      HONUA_CLOUD_DEMO_API_KEY: ${{ secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      HONUA_CLOUD_DEMO_BEARER_TOKEN: ${{ secrets.HONUA_CLOUD_DEMO_BEARER_TOKEN || '' }}
      HONUA_CLOUD_DEMO_METADATA_TTL_MS: ${{ vars.HONUA_CLOUD_DEMO_METADATA_TTL_MS || '900000' }}
      HONUA_CLOUD_DEMO_SUMMARY_FILE: test-results/cloud-demo-smoke.json
      HONUA_CLOUD_DEMO_ALLOW_WRITES: ${{ vars.HONUA_CLOUD_DEMO_ALLOW_WRITES || 'false' }}
      HONUA_CLOUD_DEMO_WRITE_TOKEN: ${{ secrets.HONUA_CLOUD_DEMO_WRITE_TOKEN || '' }}
      HONUA_CLOUD_DEMO_RESET_TOKEN: ${{ secrets.HONUA_CLOUD_DEMO_RESET_TOKEN || '' }}
      HONUA_CLOUD_DEMO_RESET_URL: ${{ secrets.HONUA_CLOUD_DEMO_RESET_URL || vars.HONUA_CLOUD_DEMO_RESET_URL || '' }}

      VITE_HONUA_QUICKSTART_BASE_URL: ${{ vars.VITE_HONUA_QUICKSTART_BASE_URL || vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      VITE_HONUA_QUICKSTART_SERVICE_ID: ${{ vars.VITE_HONUA_QUICKSTART_SERVICE_ID || 'natural-earth' }}
      VITE_HONUA_QUICKSTART_LAYER_ID: ${{ vars.VITE_HONUA_QUICKSTART_LAYER_ID || '0' }}
      VITE_HONUA_QUICKSTART_WHERE: ${{ vars.VITE_HONUA_QUICKSTART_WHERE || '1=1' }}
      VITE_HONUA_QUICKSTART_RESULT_RECORD_COUNT: ${{ vars.VITE_HONUA_QUICKSTART_RESULT_RECORD_COUNT || '25' }}
      VITE_HONUA_QUICKSTART_BASEMAP_STYLE: ${{ vars.VITE_HONUA_QUICKSTART_BASEMAP_STYLE || 'https://demotiles.maplibre.org/style.json' }}
      VITE_HONUA_QUICKSTART_API_KEY: ${{ secrets.VITE_HONUA_QUICKSTART_API_KEY || secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      VITE_HONUA_QUICKSTART_BEARER_TOKEN: ${{ secrets.VITE_HONUA_QUICKSTART_BEARER_TOKEN || secrets.HONUA_CLOUD_DEMO_BEARER_TOKEN || '' }}

      VITE_HONUA_SERVICE_EXPLORER_BASE_URL: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_BASE_URL || vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      VITE_HONUA_SERVICE_EXPLORER_MODE: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_MODE || 'auto' }}
      VITE_HONUA_SERVICE_EXPLORER_SERVICE_ID: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_SERVICE_ID || 'natural-earth' }}
      VITE_HONUA_SERVICE_EXPLORER_LAYER_ID: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_LAYER_ID || '0' }}
      VITE_HONUA_SERVICE_EXPLORER_WHERE: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_WHERE || '1=1' }}
      VITE_HONUA_SERVICE_EXPLORER_RESULT_RECORD_COUNT: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_RESULT_RECORD_COUNT || '100' }}
      VITE_HONUA_SERVICE_EXPLORER_MAP_MOVE_DEBOUNCE_MS: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_MAP_MOVE_DEBOUNCE_MS || '160' }}
      VITE_HONUA_SERVICE_EXPLORER_SOURCE_ID: ${{ vars.VITE_HONUA_SERVICE_EXPLORER_SOURCE_ID || '' }}
      VITE_HONUA_SERVICE_EXPLORER_API_KEY: ${{ secrets.VITE_HONUA_SERVICE_EXPLORER_API_KEY || secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      VITE_HONUA_SERVICE_EXPLORER_BEARER_TOKEN: ${{ secrets.VITE_HONUA_SERVICE_EXPLORER_BEARER_TOKEN || secrets.HONUA_CLOUD_DEMO_BEARER_TOKEN || '' }}

      VITE_HONUA_25D_BASE_URL: ${{ vars.VITE_HONUA_25D_BASE_URL || vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      VITE_HONUA_25D_API_KEY: ${{ secrets.VITE_HONUA_25D_API_KEY || secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      VITE_HONUA_25D_ASSETS_COLLECTION: ${{ vars.VITE_HONUA_25D_ASSETS_COLLECTION || 'story-25d-assets' }}
      VITE_HONUA_25D_ROUTE_COLLECTION: ${{ vars.VITE_HONUA_25D_ROUTE_COLLECTION || 'story-25d-route' }}
      VITE_HONUA_25D_STOPS_COLLECTION: ${{ vars.VITE_HONUA_25D_STOPS_COLLECTION || 'story-25d-stops' }}
      VITE_HONUA_25D_BASEMAP_STYLE: ${{ vars.VITE_HONUA_25D_BASEMAP_STYLE || 'https://demotiles.maplibre.org/style.json' }}

      HONUA_DEMO_BASE_URL: ${{ vars.HONUA_DEMO_BASE_URL || vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      HONUA_DEMO_API_KEY: ${{ secrets.HONUA_DEMO_API_KEY || secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      HONUA_DEMO_BEARER_TOKEN: ${{ secrets.HONUA_DEMO_BEARER_TOKEN || secrets.HONUA_CLOUD_DEMO_BEARER_TOKEN || '' }}
      HONUA_DEMO_ENV_LABEL: ${{ vars.HONUA_DEMO_ENV_LABEL || 'seeded Honua Cloud demo' }}
      HONUA_DEMO_INCIDENTS_SERVICE_ID: ${{ vars.HONUA_DEMO_INCIDENTS_SERVICE_ID || 'ops-analytics' }}
      HONUA_DEMO_INCIDENTS_LAYER_ID: ${{ vars.HONUA_DEMO_INCIDENTS_LAYER_ID || '0' }}
      HONUA_DEMO_UNIT_TRACKS_SERVICE_ID: ${{ vars.HONUA_DEMO_UNIT_TRACKS_SERVICE_ID || 'ops-analytics' }}
      HONUA_DEMO_UNIT_TRACKS_LAYER_ID: ${{ vars.HONUA_DEMO_UNIT_TRACKS_LAYER_ID || '1' }}
      HONUA_DEMO_COVERAGE_ZONES_SERVICE_ID: ${{ vars.HONUA_DEMO_COVERAGE_ZONES_SERVICE_ID || 'ops-analytics' }}
      HONUA_DEMO_COVERAGE_ZONES_LAYER_ID: ${{ vars.HONUA_DEMO_COVERAGE_ZONES_LAYER_ID || '2' }}

      VITE_HONUA_INCIDENT_TRANSPORT: ${{ vars.VITE_HONUA_INCIDENT_TRANSPORT || 'cloud' }}
      VITE_HONUA_INCIDENT_STREAM_URL: ${{ vars.VITE_HONUA_INCIDENT_STREAM_URL || 'https://cloud.honua.io/api/v1/realtime/incidents/sse' }}

      VITE_HONUA_EDIT_WORKFLOW_BASE_URL: ${{ vars.VITE_HONUA_EDIT_WORKFLOW_BASE_URL || vars.HONUA_CLOUD_DEMO_BASE_URL || 'https://cloud.honua.io' }}
      VITE_HONUA_EDIT_WORKFLOW_API_KEY: ${{ secrets.VITE_HONUA_EDIT_WORKFLOW_API_KEY || secrets.HONUA_CLOUD_DEMO_API_KEY || '' }}
      VITE_HONUA_EDIT_WORKFLOW_BEARER_TOKEN: ${{ secrets.VITE_HONUA_EDIT_WORKFLOW_BEARER_TOKEN || secrets.HONUA_CLOUD_DEMO_BEARER_TOKEN || '' }}
      VITE_HONUA_EDIT_WORKFLOW_SERVICE_ID: ${{ vars.VITE_HONUA_EDIT_WORKFLOW_SERVICE_ID || 'field-inspections-demo-writable' }}
      VITE_HONUA_EDIT_WORKFLOW_LAYER_ID: ${{ vars.VITE_HONUA_EDIT_WORKFLOW_LAYER_ID || '0' }}
      VITE_HONUA_EDIT_WORKFLOW_READONLY_SERVICE_ID: ${{ vars.VITE_HONUA_EDIT_WORKFLOW_READONLY_SERVICE_ID || 'field-inspections-demo-readonly' }}
    steps:
      - name: Checkout Terraform validation assets
        uses: actions/checkout@v4
        with:
          path: honua-terraform

      - name: Checkout honua-sdk-js
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-sdk-js
          ref: ${{ inputs.sdk_ref || 'trunk' }}
          path: honua-sdk-js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: honua-sdk-js/package-lock.json

      - name: Install JS dependencies
        working-directory: honua-sdk-js
        run: npm ci

      - name: Validate cloud demo env wiring
        shell: bash
        run: |
          set -euo pipefail

          strict_args=()
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.strict_env }}" == "true" ]]; then
            strict_args+=(--strict-required-env)
          fi

          node honua-terraform/scripts/write-cloud-demo-smoke-env-summary.mjs \
            --manifest honua-sdk-js/examples/cloud-demo-services.json \
            --out honua-sdk-js/test-results/cloud-demo-env-summary.json \
            "${strict_args[@]}"

      - name: Run cloud demo contract tests
        working-directory: honua-sdk-js
        run: npm run test:cloud-demo:config

      - name: Run seeded cloud staging smoke
        working-directory: honua-sdk-js
        run: npm run test:cloud-demo:staging

      - name: Upload smoke summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-demo-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            honua-sdk-js/test-results/cloud-demo-env-summary.json
            honua-sdk-js/test-results/cloud-demo-smoke.json
          if-no-files-found: warn
