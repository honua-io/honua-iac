name: Terraform Validation Infra Reaper

# Scheduled backstop for the AWS infrastructure terraform-manual-validation
# strands (#142). The sibling sweeper (terraform-validation-iam-sweeper.yml)
# reaps the per-run IAM principals; this one reaps the part that costs money --
# NAT gateways, ALBs, RDS instances, ElastiCache groups, ECS clusters, VPCs.
#
# The manual-validation jobs now reap their own cell on every exit path, so most
# of the time this finds nothing. It exists for the paths no in-job step can
# cover:
#
#   * the runner is cancelled or lost, so nothing on it runs at all;
#   * the shared data stack that --keep-data deliberately retains for a later
#     run that never comes. Two of the 28 leaking runs in #142 concluded
#     `success` -- teardown-on-failure would never have caught them.
#
# What stops this from deleting something live is in the script, not here:
# Owner=terraform-validation is the only way a resource becomes a candidate, its
# ValidationRunId must name a GitHub run that is `completed`, that run must be
# outside the grace window, the resource's own ExpiresAtUTC TTL must have
# elapsed, and the whole sweep defers while any validation run is in progress.
# infrastructure/terraform/validation/scripts/aws/test-sweep-orphaned-validation-infra.sh
# exercises each of those refusals against a fake AWS.
#
# Note on dispatch: `dry_run` defaults to true for a human poking at it. The
# schedule supplies no inputs, so the nightly run is a REAL sweep.

on:
  schedule:
    - cron: "29 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Enumerate and print the plan without deleting anything"
        required: true
        type: boolean
        default: true
      grace_hours:
        description: "Hours a run must have been completed before its cell is reapable"
        required: false
        type: string
        default: "4"
      max_delete:
        description: "Abandon the sweep if the plan exceeds this many resources"
        required: false
        type: string
        default: "400"
      legacy_release_cell_vpcs:
        description: "Also reap empty pre-run-id honua-release cell VPCs (CloudTrail-attributed; see the script header). Dispatch only."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-validation-infra-reaper
  cancel-in-progress: false

jobs:
  # The schedule fires on every trunk head whether or not the operator has
  # provisioned the cleanup role yet. An unprovisioned role is an absent
  # environment, not a failed cleanup: report it here and let the reaper job
  # conclude `skipped` (honua-release#376 R18/R21) instead of reddening the
  # head. This is the ONLY condition that skips the reaper; once the variable is
  # set every run assumes the role exactly as before.
  precondition:
    name: Require reaper OIDC role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.role.outputs.configured }}
    steps:
      - name: Check HONUA_AWS_VALIDATION_REAPER_ROLE_ARN
        id: role
        env:
          ROLE_ARN: ${{ vars.HONUA_AWS_VALIDATION_REAPER_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ROLE_ARN}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason="SKIPPED: HONUA_AWS_VALIDATION_REAPER_ROLE_ARN is not set; apply infrastructure/terraform/bootstrap/aws-validation-reaper (the #208 OIDC cleanup role with the standing/demo teardown deny) and set the repository variable to its role_arn output to run the reaper."
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=reaper skipped::${reason}"
          echo "${reason}" >> "$GITHUB_STEP_SUMMARY"

  reap:
    name: Reap orphaned validation infrastructure
    needs: precondition
    if: ${{ needs.precondition.outputs.configured == 'true' }}
    # The reaper role trusts exactly this environment's OIDC subject
    # (bootstrap/aws-validation-reaper), not every trunk workflow.
    environment: aws-validation-reaper
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_DEFAULT_REGION: ${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}
      HONUA_AWS_SWEEP_REGIONS: ${{ vars.HONUA_AWS_SWEEP_REGIONS || 'us-east-1,us-west-2' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require OIDC role
        env:
          ROLE_ARN: ${{ vars.HONUA_AWS_VALIDATION_REAPER_ROLE_ARN }}
        run: ': "${ROLE_ARN:?Configure the OIDC cleanup role ARN}"'

      - name: Configure AWS OIDC session
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_VALIDATION_REAPER_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-duration-seconds: 7200
          unset-current-credentials: true

      - name: Reap orphaned validation infrastructure
        shell: bash
        run: |
          set -euo pipefail


          args=(
            --grace-hours "${{ inputs.grace_hours || '4' }}"
            --max-delete "${{ inputs.max_delete || '400' }}"
            --summary-file "$GITHUB_STEP_SUMMARY"
          )

          IFS=',' read -ra regions <<< "$HONUA_AWS_SWEEP_REGIONS"
          for region in "${regions[@]}"; do
            region="$(echo "$region" | xargs)"
            [[ -z "$region" ]] && continue
            args+=(--region "$region")
          done

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          # Opt-in only from a dispatch; the schedule supplies no inputs.
          if [[ "${{ inputs.legacy_release_cell_vpcs }}" == "true" ]]; then
            args+=(--legacy-release-cell-vpcs)
          fi

          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-validation-infra.sh "${args[@]}"

      # AWS Batch creates an untagged ECS cluster per compute environment; one
      # whose compute environment is gone is invisible to the tag sweep above
      # Runs even when that sweep reported survivors.
      - name: Reap ECS clusters of deleted Batch compute environments
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--summary-file "$GITHUB_STEP_SUMMARY")
          IFS=',' read -ra regions <<< "$HONUA_AWS_SWEEP_REGIONS"
          for region in "${regions[@]}"; do
            region="$(echo "$region" | xargs)"
            [[ -z "$region" ]] && continue
            args+=(--region "$region")
          done
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-batch-clusters.sh "${args[@]}"

  # honua-release retired the release-cell producer and its scheduled
  # reaper. Resources that reaper's last sweeps left behind still carry
  # Owner=release-cell and are swept here, by the same script, under the
  # release-cell reaper role (bootstrap/aws-release-cells, lane "reaper"), whose
  # trust names this repository's aws-cell-reaper environment. Run state is read
  # from honua-release, where the cells' ValidationRunIds point.
  release-cell-precondition:
    name: Require release-cell reaper role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.role.outputs.configured }}
    steps:
      - name: Check HONUA_AWS_CELL_REAPER_ROLE_ARN
        id: role
        env:
          ROLE_ARN: ${{ vars.HONUA_AWS_CELL_REAPER_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ROLE_ARN}" ]]; then
            [[ "${ROLE_ARN}" =~ ^arn:aws:iam::[0-9]{12}:role/honua-release-cell-reaper$ ]] || {
              echo "::error::HONUA_AWS_CELL_REAPER_ROLE_ARN must name the dedicated honua-release-cell-reaper role"; exit 1; }
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason="SKIPPED: HONUA_AWS_CELL_REAPER_ROLE_ARN is not set; apply infrastructure/terraform/bootstrap/aws-release-cells (reaper lane trusting repo:honua-io/honua-iac:environment:aws-cell-reaper) and set the repository variable to its role_arns.reaper output to sweep release-cell leftovers."
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=release-cell reaper skipped::${reason}"
          echo "${reason}" >> "$GITHUB_STEP_SUMMARY"

  reap-release-cells:
    name: Reap orphaned release cells
    needs: release-cell-precondition
    if: ${{ needs.release-cell-precondition.outputs.configured == 'true' }}
    environment: aws-cell-reaper
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AWS_DEFAULT_REGION: us-east-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS OIDC session
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_CELL_REAPER_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 7200
          unset-current-credentials: true

      - name: Reap orphaned release cells
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_DELETE: ${{ inputs.max_delete || '400' }}
        run: |
          set -euo pipefail
          [[ "$MAX_DELETE" =~ ^[0-9]+$ ]] || { echo "::error::max_delete must be an integer"; exit 1; }
          # A 48-hour floor: the producer is retired, so nothing here is young.
          args=(
            --owner-tag release-cell
            --repo honua-io/honua-release
            --workflow e2e-cloud-aws.yml
            --region us-east-1
            --grace-hours 48
            --max-delete "$MAX_DELETE"
            --exclude-type ecs:task-definition
            --summary-file "$GITHUB_STEP_SUMMARY"
          )
          [[ "$DRY_RUN" == "true" ]] && args+=(--dry-run)
          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-validation-infra.sh "${args[@]}"
