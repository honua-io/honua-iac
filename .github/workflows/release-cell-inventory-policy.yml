name: Release cell inventory policy
on:
  workflow_dispatch:
    inputs:
      release_root_sha:
        description: Full reviewed honua-release trunk commit containing the fixed policy root
        required: true
        type: string
      mode:
        description: Review metadata only, or apply the single imported policy through human approval
        required: true
        type: choice
        options: [plan, deploy]
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: release-cell-inventory-policy
  cancel-in-progress: false
jobs:
  approval-policy:
    if: github.repository == 'honua-io/honua-iac' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-release
          ref: trunk
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reviewed source
        env:
          ROOT_SHA: ${{ inputs.release_root_sha }}
        run: |
          set -euo pipefail
          [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ROOT_SHA" origin/trunk
          git checkout --detach "$ROOT_SHA"
          test "$(git rev-parse HEAD)" = "$ROOT_SHA"
      # The OIDC role trusts the environment, so the environment's rules are the
      # gate: trunk only, no administrator bypass, and a human reviewer for deploy.
      - name: Verify the policy job's environment protection
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ inputs.mode == 'deploy' && 'cell-inventory-apply' || 'cell-inventory-plan' }}
          NEEDS_REVIEWER: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          base="repos/${GITHUB_REPOSITORY}/environments/${ENVIRONMENT}"
          env_json="$(gh api "$base")"
          jq -e '.can_admins_bypass == false and .deployment_branch_policy.custom_branch_policies == true' <<<"$env_json" >/dev/null \
            || { echo "::error::${ENVIRONMENT} must be custom-branch (trunk) with administrator bypass off"; exit 1; }
          branches="$(gh api "${base}/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type):\(.name)"] | sort | join(",")')"
          [[ "$branches" == "branch:trunk" ]] || { echo "::error::${ENVIRONMENT} admits ${branches:-nothing}, expected branch:trunk only"; exit 1; }
          if [[ "$NEEDS_REVIEWER" == "true" ]]; then
            jq -e '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length > 0' <<<"$env_json" >/dev/null \
              || { echo "::error::${ENVIRONMENT} needs a required reviewer before deploy"; exit 1; }
          fi
  policy:
    needs: approval-policy
    if: github.repository == 'honua-io/honua-iac' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each environment is used by this workflow alone and is trusted by exactly
    # one OIDC role (honua-iac bootstrap/aws-ci-oidc-roles): plan reads the
    # release role's inline policy, deploy (founder approval) may also write it.
    environment: ${{ inputs.mode == 'deploy' && 'cell-inventory-apply' || 'cell-inventory-plan' }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      RELEASE_ROOT_SHA: ${{ inputs.release_root_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-release
          ref: trunk
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed source on protected trunk
        run: |
          set -euo pipefail
          [[ "$RELEASE_ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_ROOT_SHA" origin/trunk
          git checkout --detach "$RELEASE_ROOT_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_ROOT_SHA"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Install the read-only observation client
        run: python3 -m pip install 'boto3>=1.35,<2'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.mode == 'deploy' && 'arn:aws:iam::585192672263:role/honua-iac-gha-cell-inventory-apply' || 'arn:aws:iam::585192672263:role/honua-iac-gha-cell-inventory-plan' }}
          aws-region: us-east-1
      - name: Review and optionally apply the sole imported inline policy
        env:
          MODE: ${{ inputs.mode }}
        run: python3 tools/cloud_cell_inventory_policy.py "$MODE"
      - name: Retain metadata only; no policy documents, state, plans or private logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cell-inventory-review-${{ github.run_id }}
          path: ${{ runner.temp }}/cell-inventory-review.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private executor material
        if: always()
        run: rm -rf "$RUNNER_TEMP/cell-inventory-private"
