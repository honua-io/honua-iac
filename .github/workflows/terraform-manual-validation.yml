name: Terraform Manual Validation

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud target"
        required: true
        type: choice
        default: both
        options:
          - both
          - azure
          - aws
      deployment_profile:
        description: "Deployment profile"
        required: true
        type: choice
        default: ephemeral
        options:
          - ephemeral
          - persistent
      apply_confirmation:
        description: "Type APPROVED for persistent apply"
        required: false
        type: string
        default: ""
      run_live:
        description: "Run live plan/apply/smoke/destroy tests"
        required: true
        type: boolean
        default: false
      reuse_data_stack:
        description: "Reuse shared PostGIS/Redis data stacks across workflow runs when possible"
        required: true
        type: boolean
        default: true
      run_k8s:
        description: "Run local Kubernetes validation (k3d + Helm + observability)"
        required: true
        type: boolean
        default: true
      run_aks:
        description: "Run AKS validation (Terraform cluster + Kubernetes checks)"
        required: true
        type: boolean
        default: false
      run_eks:
        description: "Run EKS validation (Terraform cluster + Kubernetes checks)"
        required: true
        type: boolean
        default: false
      run_drift:
        description: "Run drift detection job"
        required: true
        type: boolean
        default: false
      no_destroy:
        description: "Keep resources after live test"
        required: true
        type: boolean
        default: false
      allow_destroy_plan:
        description: "Allow apply when plan includes destroys"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-manual-validation-${{ github.ref }}-${{ inputs.cloud }}-${{ inputs.deployment_profile }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HONUA_VALIDATION_GHA_VARS_JSON: ${{ toJSON(vars) }}

jobs:
  static-validate:
    name: Static Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Restore Terraform plugin cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run static validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            static-validate

  policy-gates:
    name: Terraform Policy Gates
    needs: static-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Restore Terraform plugin cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install checkov
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov==3.2.477

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${HONUA_TERRAFORM_ENABLE_TFSEC:-false}" != "true" ]]; then
            echo "tfsec disabled for this workflow run; skipping install"
            exit 0
          fi

          if ! curl -fsSL https://raw.githubusercontent.com/aquasecurity/tfsec/b692c20b68c0121346b7b34e81d6b1867ca8e1a8/scripts/install_linux.sh | bash; then
            echo "tfsec install failed; continuing because tfsec is optional in policy gates"
            exit 0
          fi

          tfsec --version || true

      - name: Run Terraform policy gates via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            policy-gates \
            --strict true

  azure-live:
    name: Azure Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && (inputs.cloud == 'both' || inputs.cloud == 'azure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      BOOTSTRAP_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      BOOTSTRAP_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      BOOTSTRAP_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
      HONUA_AZURE_EXISTING_DB_CONNECTION_STRING: ${{ secrets.HONUA_AZURE_EXISTING_DB_CONNECTION_STRING || '' }}
      HONUA_AZURE_EXISTING_REDIS_CONNECTION_STRING: ${{ secrets.HONUA_AZURE_EXISTING_REDIS_CONNECTION_STRING || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Azure data reuse cache
        if: ${{ inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/azure-data-reuse.env
          key: terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ vars.HONUA_AZURE_VALIDATION_REGION || 'westus' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ vars.HONUA_AZURE_VALIDATION_REGION || 'westus' }}-

      - name: Run Azure validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            azure-live \
            --deployment-profile "${{ inputs.deployment_profile }}" \
            --apply-confirmation "${{ inputs.apply_confirmation }}" \
            --reuse-data-stack "${{ inputs.reuse_data_stack }}" \
            --allow-destroy-plan "${{ inputs.allow_destroy_plan }}" \
            --no-destroy "${{ inputs.no_destroy }}"

      - name: Upload Azure plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/azure
          if-no-files-found: ignore

      - name: Save Azure data reuse cache
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/azure-data-reuse.env
          key: terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ vars.HONUA_AZURE_VALIDATION_REGION || 'westus' }}-${{ github.run_id }}-${{ github.run_attempt }}

  aws-live:
    name: AWS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && (inputs.cloud == 'both' || inputs.cloud == 'aws') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      BOOTSTRAP_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BOOTSTRAP_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
      HONUA_AWS_EXISTING_DB_CONNECTION_STRING: ${{ secrets.HONUA_AWS_EXISTING_DB_CONNECTION_STRING || '' }}
      HONUA_AWS_EXISTING_REDIS_CONNECTION_STRING: ${{ secrets.HONUA_AWS_EXISTING_REDIS_CONNECTION_STRING || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore AWS data reuse cache
        if: ${{ inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/aws-data-reuse.env
          key: terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}-

      - name: Run AWS validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            aws-live \
            --deployment-profile "${{ inputs.deployment_profile }}" \
            --apply-confirmation "${{ inputs.apply_confirmation }}" \
            --reuse-data-stack "${{ inputs.reuse_data_stack }}" \
            --allow-destroy-plan "${{ inputs.allow_destroy_plan }}" \
            --no-destroy "${{ inputs.no_destroy }}"

      - name: Upload AWS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/aws
          if-no-files-found: ignore

      - name: Save AWS data reuse cache
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/aws-data-reuse.env
          key: terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}-${{ github.run_id }}-${{ github.run_attempt }}

  k8s-live:
    name: Kubernetes Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_k8s }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install k3d
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/b481dca24e34145edcdd14de72ebe4f56ec8e8bc/install.sh | bash
          k3d version

      - name: Run Kubernetes validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            k8s-live \
            --deployment-profile "${{ inputs.deployment_profile }}" \
            --apply-confirmation "${{ inputs.apply_confirmation }}" \
            --no-destroy "${{ inputs.no_destroy }}"

  aks-live:
    name: AKS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_aks && (inputs.cloud == 'both' || inputs.cloud == 'azure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      BOOTSTRAP_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      BOOTSTRAP_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      BOOTSTRAP_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Run AKS validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            aks-live \
            --deployment-profile "${{ inputs.deployment_profile }}" \
            --apply-confirmation "${{ inputs.apply_confirmation }}" \
            --allow-destroy-plan "${{ inputs.allow_destroy_plan }}" \
            --no-destroy "${{ inputs.no_destroy }}"

      - name: Upload AKS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aks-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/aks
          if-no-files-found: ignore

  eks-live:
    name: EKS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_eks && (inputs.cloud == 'both' || inputs.cloud == 'aws') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      BOOTSTRAP_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BOOTSTRAP_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Run EKS validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            eks-live \
            --deployment-profile "${{ inputs.deployment_profile }}" \
            --apply-confirmation "${{ inputs.apply_confirmation }}" \
            --allow-destroy-plan "${{ inputs.allow_destroy_plan }}" \
            --no-destroy "${{ inputs.no_destroy }}"

      - name: Upload EKS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eks-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/eks
          if-no-files-found: ignore

  drift-detect:
    name: Terraform Drift Detection
    needs: policy-gates
    if: ${{ inputs.run_drift }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Terraform plugin cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run drift detection via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            drift \
            --cloud "${{ inputs.cloud }}" \
            --run-aks "${{ inputs.run_aks }}" \
            --run-eks "${{ inputs.run_eks }}"

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/drift
          if-no-files-found: ignore
