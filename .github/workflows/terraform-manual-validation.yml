name: Terraform Manual Validation

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: "Exact honua-iac branch, tag, or commit SHA to validate"
        required: false
        type: string
        default: ""
      cloud:
        description: "Cloud target"
        required: true
        type: choice
        default: both
        options:
          - both
          - azure
          - aws
      deployment_profile:
        description: "Deployment profile"
        required: true
        type: choice
        default: ephemeral
        options:
          - ephemeral
          - persistent
      apply_confirmation:
        description: "Type APPROVED for persistent apply"
        required: false
        type: string
        default: ""
      run_live:
        description: "Run live plan/apply/smoke/destroy tests"
        required: true
        type: boolean
        default: false
      reuse_data_stack:
        description: "Reuse shared PostGIS/Redis data stacks across workflow runs when possible"
        required: true
        type: boolean
        default: true
      run_k8s:
        description: "Run local Kubernetes validation (k3d + Helm + observability)"
        required: true
        type: boolean
        default: true
      run_aks:
        description: "Run AKS validation (Terraform cluster + Kubernetes checks)"
        required: true
        type: boolean
        default: false
      run_eks:
        description: "Run EKS validation (Terraform cluster + Kubernetes checks)"
        required: true
        type: boolean
        default: false
      run_drift:
        description: "Run drift detection job"
        required: true
        type: boolean
        default: false
      no_destroy:
        description: "Keep resources after live test"
        required: true
        type: boolean
        default: false
      allow_destroy_plan:
        description: "Allow apply when plan includes destroys"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-manual-validation-${{ github.ref }}-${{ inputs.cloud }}-${{ inputs.deployment_profile }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  AZURE_VALIDATION_REGION: ${{ vars.HONUA_AZURE_VALIDATION_REGION || 'westus' }}
  AWS_VALIDATION_REGION: ${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}
  AZURE_VALIDATION_STACK: ${{ vars.HONUA_AZURE_VALIDATION_STACK || 'both' }}
  AWS_VALIDATION_STACK: ${{ vars.HONUA_AWS_VALIDATION_STACK || 'both' }}
  HONUA_READY_SLO_SECONDS: ${{ vars.HONUA_READY_SLO_SECONDS || '600' }}
  HONUA_MAX_LOAD_ERROR_RATE_PERCENT: ${{ vars.HONUA_MAX_LOAD_ERROR_RATE_PERCENT || '0' }}
  HONUA_MAX_RUN_COST_USD: ${{ vars.HONUA_MAX_RUN_COST_USD || '0' }}
  HONUA_TTL_HOURS: ${{ vars.HONUA_TTL_HOURS || '8' }}
  HONUA_RUN_UPGRADE_ROLLBACK: ${{ vars.HONUA_RUN_UPGRADE_ROLLBACK || 'false' }}
  HONUA_SKIP_DB_RESILIENCE: ${{ vars.HONUA_SKIP_DB_RESILIENCE || 'false' }}
  HONUA_SKIP_QUOTA_PREFLIGHT: ${{ vars.HONUA_SKIP_QUOTA_PREFLIGHT || 'false' }}
  HONUA_SKIP_HELM_STATIC_VALIDATION: ${{ vars.HONUA_SKIP_HELM_STATIC_VALIDATION || 'false' }}
  HONUA_SKIP_OBSERVABILITY: ${{ vars.HONUA_SKIP_OBSERVABILITY || 'false' }}
  HONUA_SKIP_IDEMPOTENCY: ${{ vars.HONUA_SKIP_IDEMPOTENCY || 'false' }}
  HONUA_SKIP_PROTOCOL_CHECKS: ${{ vars.HONUA_SKIP_PROTOCOL_CHECKS || 'false' }}
  HONUA_SKIP_SCALE_CHECK: ${{ vars.HONUA_SKIP_SCALE_CHECK || 'false' }}
  HONUA_AZURE_NAME_PREFIX_BASE: ${{ vars.HONUA_AZURE_NAME_PREFIX_BASE || '' }}
  HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_ENABLED: ${{ vars.HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_ENABLED || 'false' }}
  HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_NAME: ${{ vars.HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_NAME || 'staging' }}
  HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_IMAGE: ${{ vars.HONUA_AZURE_FUNCTIONS_DEPLOYMENT_SLOT_IMAGE || '' }}
  HONUA_AWS_NAME_PREFIX_BASE: ${{ vars.HONUA_AWS_NAME_PREFIX_BASE || '' }}
  HONUA_AZURE_EXISTING_DB_FQDN: ${{ vars.HONUA_AZURE_EXISTING_DB_FQDN || '' }}
  HONUA_AZURE_EXISTING_DB_RESOURCE_GROUP: ${{ vars.HONUA_AZURE_EXISTING_DB_RESOURCE_GROUP || '' }}
  HONUA_AZURE_EXISTING_DB_CONNECTION_STRING: ${{ secrets.HONUA_AZURE_EXISTING_DB_CONNECTION_STRING || vars.HONUA_AZURE_EXISTING_DB_CONNECTION_STRING || '' }}
  HONUA_AZURE_EXISTING_REDIS_CONNECTION_STRING: ${{ secrets.HONUA_AZURE_EXISTING_REDIS_CONNECTION_STRING || vars.HONUA_AZURE_EXISTING_REDIS_CONNECTION_STRING || '' }}
  HONUA_AWS_EXISTING_DB_ENDPOINT: ${{ vars.HONUA_AWS_EXISTING_DB_ENDPOINT || '' }}
  HONUA_AWS_EXISTING_DB_CONNECTION_STRING: ${{ secrets.HONUA_AWS_EXISTING_DB_CONNECTION_STRING || vars.HONUA_AWS_EXISTING_DB_CONNECTION_STRING || '' }}
  HONUA_AWS_EXISTING_REDIS_CONNECTION_STRING: ${{ secrets.HONUA_AWS_EXISTING_REDIS_CONNECTION_STRING || vars.HONUA_AWS_EXISTING_REDIS_CONNECTION_STRING || '' }}
  HONUA_AWS_EXISTING_VPC_ID: ${{ vars.HONUA_AWS_EXISTING_VPC_ID || '' }}
  HONUA_AWS_EXISTING_VPC_CIDR: ${{ vars.HONUA_AWS_EXISTING_VPC_CIDR || '' }}
  HONUA_AWS_EXISTING_PUBLIC_SUBNET_IDS: ${{ vars.HONUA_AWS_EXISTING_PUBLIC_SUBNET_IDS || '' }}
  HONUA_AWS_EXISTING_PRIVATE_SUBNET_IDS: ${{ vars.HONUA_AWS_EXISTING_PRIVATE_SUBNET_IDS || '' }}
  HONUA_AWS_KEEP_DATA: ${{ vars.HONUA_AWS_KEEP_DATA || 'false' }}
  HONUA_AWS_ECS_CANARY_ENABLED: ${{ vars.HONUA_AWS_ECS_CANARY_ENABLED || 'false' }}
  HONUA_AWS_ECS_CANARY_DESIRED_COUNT: ${{ vars.HONUA_AWS_ECS_CANARY_DESIRED_COUNT || '1' }}
  HONUA_AWS_ECS_CANARY_WEIGHT_PERCENTAGE: ${{ vars.HONUA_AWS_ECS_CANARY_WEIGHT_PERCENTAGE || '0' }}
  HONUA_AWS_ECS_CANARY_HEADER_NAME: ${{ vars.HONUA_AWS_ECS_CANARY_HEADER_NAME || 'X-Honua-Canary' }}
  HONUA_AWS_ECS_CANARY_HEADER_VALUE: ${{ vars.HONUA_AWS_ECS_CANARY_HEADER_VALUE || 'always' }}
  HONUA_AKS_NAME_PREFIX_BASE: ${{ vars.HONUA_AKS_NAME_PREFIX_BASE || '' }}
  HONUA_EKS_NAME_PREFIX_BASE: ${{ vars.HONUA_EKS_NAME_PREFIX_BASE || '' }}
  HONUA_DRIFT_ROOTS: ${{ vars.HONUA_DRIFT_ROOTS || '' }}
  HONUA_DRIFT_VAR_FILES: ${{ vars.HONUA_DRIFT_VAR_FILES || '' }}

jobs:
  static-validate:
    name: Static Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          terraform fmt -check -recursive docs/devops/examples

      - name: Terraform init/validate (selected roots)
        shell: bash
        run: |
          set -euo pipefail

          roots=(
            "infrastructure/terraform/bootstrap/azure-aca"
            "infrastructure/terraform/bootstrap/azure-functions"
            "infrastructure/terraform/bootstrap/azure-aks"
            "infrastructure/terraform/bootstrap/aws-ecs"
            "infrastructure/terraform/bootstrap/aws-serverless"
            "infrastructure/terraform/bootstrap/aws-eks"
            "infrastructure/terraform/examples/azure"
            "infrastructure/terraform/examples/azure-data"
            "infrastructure/terraform/examples/azure-functions"
            "infrastructure/terraform/examples/aws"
            "infrastructure/terraform/examples/aws-serverless"
            "infrastructure/terraform/examples/aws-data"
            "infrastructure/terraform/examples/azure-aks"
            "infrastructure/terraform/examples/aws-eks"
            "infrastructure/terraform/examples/observability"
            "infrastructure/terraform/modules/azure-aca"
            "infrastructure/terraform/modules/azure-data"
            "infrastructure/terraform/modules/azure-functions"
            "infrastructure/terraform/modules/aws-ecs"
            "infrastructure/terraform/modules/aws-serverless"
            "infrastructure/terraform/modules/aws-data"
            "infrastructure/terraform/modules/azure-aks"
            "infrastructure/terraform/modules/aws-eks"
            "infrastructure/terraform/modules/observability-stack"
            "docs/devops/examples"
          )

          for root in "${roots[@]}"; do
            echo "::group::terraform init ($root)"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            echo "::endgroup::"

            echo "::group::terraform validate ($root)"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done

  policy-gates:
    name: Terraform Policy Gates
    needs: static-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install checkov
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov==3.2.497

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail
          TFSEC_VERSION="v1.28.14"
          TFSEC_URL="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64"
          install_dir="${HOME}/.local/bin"

          mkdir -p "$install_dir"

          if curl -fsSL "$TFSEC_URL" -o "${install_dir}/tfsec"; then
            chmod +x "${install_dir}/tfsec"
            echo "${install_dir}" >> "$GITHUB_PATH"
            "${install_dir}/tfsec" --version
          else
            echo "::warning::tfsec download failed from ${TFSEC_URL}; continuing without a local tfsec binary"
          fi

      - name: Run Terraform policy gate script
        shell: bash
        env:
          HONUA_TERRAFORM_POLICY_STRICT: "true"
        run: ./infrastructure/terraform/validation/scripts/shared/terraform-policy-gate.sh

  azure-live:
    name: Azure Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && (inputs.cloud == 'both' || inputs.cloud == 'azure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      BOOTSTRAP_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      BOOTSTRAP_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      BOOTSTRAP_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
      HONUA_ACA_IMAGE: ${{ vars.HONUA_ACA_IMAGE || '' }}
      HONUA_ACA_PREVIOUS_IMAGE: ${{ vars.HONUA_ACA_PREVIOUS_IMAGE || '' }}
      HONUA_FUNCTIONS_IMAGE: ${{ vars.HONUA_FUNCTIONS_IMAGE || '' }}
      HONUA_FUNCTIONS_PREVIOUS_IMAGE: ${{ vars.HONUA_FUNCTIONS_PREVIOUS_IMAGE || '' }}
      HONUA_AZURE_REGISTRY_USERNAME: ${{ secrets.HONUA_AZURE_REGISTRY_USERNAME || '' }}
      HONUA_AZURE_REGISTRY_PASSWORD: ${{ secrets.HONUA_AZURE_REGISTRY_PASSWORD || '' }}
      HONUA_AZURE_DATA_CACHE_FILE: ${{ github.workspace }}/.gha-cache/azure-data-reuse.env
      HONUA_PLATFORM_VALIDATION_SCRIPT: ${{ github.workspace }}/honua-server/scripts/run-cloud-post-apply-validation.sh
      HONUA_PLATFORM_VALIDATION_IMPORT_TABLE_PREFIX: ${{ inputs.deployment_profile == 'ephemeral' && inputs.no_destroy == false && format('cloud{0}{1}', github.run_id, github.run_attempt) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Restore Azure data reuse cache
        if: ${{ inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/azure-data-reuse.env
          key: terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ env.AZURE_VALIDATION_REGION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ env.AZURE_VALIDATION_REGION }}-

      - name: Validate required credentials (Azure)
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BOOTSTRAP_ARM_CLIENT_ID
            BOOTSTRAP_ARM_CLIENT_SECRET
            BOOTSTRAP_ARM_TENANT_ID
            BOOTSTRAP_ARM_SUBSCRIPTION_ID
            HONUA_ADMIN_PASSWORD
            HONUA_DB_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret for Azure live validation: $name"
              exit 1
            fi
          done

          if [[ "$AZURE_VALIDATION_STACK" == "aca" || "$AZURE_VALIDATION_STACK" == "both" ]]; then
            [[ -n "${HONUA_ACA_IMAGE:-}" ]] || { echo "Missing required Azure image configuration: HONUA_ACA_IMAGE"; exit 1; }
            if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
              [[ -n "${HONUA_ACA_PREVIOUS_IMAGE:-}" ]] || { echo "Missing required Azure image configuration: HONUA_ACA_PREVIOUS_IMAGE"; exit 1; }
            fi
          fi

          if [[ "$AZURE_VALIDATION_STACK" == "functions" || "$AZURE_VALIDATION_STACK" == "both" ]]; then
            [[ -n "${HONUA_FUNCTIONS_IMAGE:-}" ]] || { echo "Missing required Azure image configuration: HONUA_FUNCTIONS_IMAGE"; exit 1; }
            if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
              [[ -n "${HONUA_FUNCTIONS_PREVIOUS_IMAGE:-}" ]] || { echo "Missing required Azure image configuration: HONUA_FUNCTIONS_PREVIOUS_IMAGE"; exit 1; }
            fi
          fi

      - name: Enforce persistent apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_profile }}" != "ephemeral" && "${{ inputs.apply_confirmation }}" != "APPROVED" ]]; then
            echo "Persistent profile requires apply_confirmation=APPROVED"
            exit 1
          fi

      - name: Bootstrap least-privilege identities and run Azure validation
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_root="$RUNNER_TEMP/bootstrap/azure"
          plan_root="$RUNNER_TEMP/plans/azure"
          mkdir -p "$bootstrap_root" "$plan_root"

          requested_stack="$AZURE_VALIDATION_STACK"
          case "$requested_stack" in
            aca|functions|both) ;;
            *)
              echo "Unsupported AZURE_VALIDATION_STACK: $requested_stack"
              exit 1
              ;;
          esac

          cleanup_bootstrap_stack() {
            local stack="$1"
            local dir="$bootstrap_root/$stack"
            if [[ ! -f "$dir/terraform.tfstate" ]]; then
              return 0
            fi
            echo "Destroying Azure bootstrap identity for stack '$stack'"
            if ! ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
              ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
              ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
              ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
              terraform -chdir="$dir" destroy -input=false -auto-approve -no-color; then
              echo "Failed to destroy Azure bootstrap '$stack'" >&2
              return 1
            fi
          }

          cleanup_bootstrap() {
            local exit_code=$?
            local cleanup_failed=0

            cleanup_bootstrap_stack "aca" || cleanup_failed=1
            cleanup_bootstrap_stack "functions" || cleanup_failed=1

            if [[ "$cleanup_failed" -ne 0 && "$exit_code" -eq 0 ]]; then
              echo "Azure bootstrap cleanup failed" >&2
              exit_code=1
            fi

            exit "$exit_code"
          }
          trap cleanup_bootstrap EXIT

          bootstrap_azure_stack() {
            local stack="$1"
            local source_dir=""
            local app_name=""
            local role_name=""
            local target_dir="$bootstrap_root/$stack"

            case "$stack" in
              aca)
                source_dir="infrastructure/terraform/bootstrap/azure-aca"
                app_name="honua-tf-aca-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                role_name="Honua TF ACA ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT}"
                ;;
              functions)
                source_dir="infrastructure/terraform/bootstrap/azure-functions"
                app_name="honua-tf-fn-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                role_name="Honua TF Functions ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT}"
                ;;
              *)
                echo "Unsupported bootstrap stack: $stack"
                exit 1
                ;;
            esac

            mkdir -p "$target_dir"
            cp "$source_dir"/*.tf "$target_dir"/

            ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
            ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
            ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
            ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
            terraform -chdir="$target_dir" init -input=false -no-color

            ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
            ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
            ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
            ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
            terraform -chdir="$target_dir" apply -input=false -auto-approve -no-color \
              -var "app_name=${app_name}" \
              -var "role_name=${role_name}"
          }

          read_bootstrap_output() {
            local stack="$1"
            local output_name="$2"
            terraform -chdir="$bootstrap_root/$stack" output -raw "$output_name"
          }

          run_validation_for_stack() {
            local stack="$1"
            local arm_client_id="$2"
            local arm_client_secret="$3"
            local arm_tenant_id="$4"
            local arm_subscription_id="$5"
            local stack_plan_dir="$plan_root/$stack"

            mkdir -p "$stack_plan_dir"

            args=(
              --stack "$stack"
              --location "$AZURE_VALIDATION_REGION"
              --plan-artifact-dir "$stack_plan_dir"
              --max-run-cost-usd "$HONUA_MAX_RUN_COST_USD"
              --max-ready-seconds "$HONUA_READY_SLO_SECONDS"
              --max-load-error-rate "$HONUA_MAX_LOAD_ERROR_RATE_PERCENT"
              --ttl-hours "$HONUA_TTL_HOURS"
            )

            if [[ -n "$HONUA_AZURE_NAME_PREFIX_BASE" ]]; then
              args+=(--name-prefix-base "$HONUA_AZURE_NAME_PREFIX_BASE")
            fi

            if [[ "$stack" == "aca" ]]; then
              if [[ -n "${HONUA_ACA_IMAGE:-}" ]]; then
                args+=(--aca-image "$HONUA_ACA_IMAGE")
              fi
              if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
                args+=(--upgrade-rollback)
                if [[ -n "${HONUA_ACA_PREVIOUS_IMAGE:-}" ]]; then
                  args+=(--aca-previous-image "$HONUA_ACA_PREVIOUS_IMAGE")
                fi
              fi
            fi

            if [[ "$stack" == "functions" ]]; then
              if [[ -n "${HONUA_FUNCTIONS_IMAGE:-}" ]]; then
                args+=(--functions-image "$HONUA_FUNCTIONS_IMAGE")
              fi
              if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
                args+=(--upgrade-rollback)
                if [[ -n "${HONUA_FUNCTIONS_PREVIOUS_IMAGE:-}" ]]; then
                  args+=(--functions-previous-image "$HONUA_FUNCTIONS_PREVIOUS_IMAGE")
                fi
              fi
            fi

            if [[ "$HONUA_SKIP_DB_RESILIENCE" == "true" ]]; then
              args+=(--skip-db-resilience)
            fi

            if [[ "$HONUA_SKIP_QUOTA_PREFLIGHT" == "true" ]]; then
              args+=(--skip-quota-preflight)
            fi

            if [[ "${{ inputs.allow_destroy_plan }}" == "true" ]]; then
              args+=(--allow-destroy-plan)
            fi

            if [[ "${{ inputs.no_destroy }}" == "true" ]]; then
              args+=(--no-destroy)
            elif [[ "${{ inputs.deployment_profile }}" == "ephemeral" && "${{ inputs.reuse_data_stack }}" != "true" ]]; then
              args+=(--destroy-data)
            fi

            if [[ "$HONUA_SKIP_SCALE_CHECK" == "true" ]]; then
              args+=(--no-scale-check)
            fi

            if [[ "$HONUA_SKIP_IDEMPOTENCY" == "true" ]]; then
              args+=(--skip-idempotency)
            fi

            if [[ "$HONUA_SKIP_PROTOCOL_CHECKS" == "true" ]]; then
              args+=(--skip-protocol-checks)
            fi

            ARM_CLIENT_ID="$arm_client_id" \
            ARM_CLIENT_SECRET="$arm_client_secret" \
            ARM_TENANT_ID="$arm_tenant_id" \
            ARM_SUBSCRIPTION_ID="$arm_subscription_id" \
            HONUA_VALIDATION_RUN_ID="gha-${{ github.run_id }}-azure-${stack}" \
            ./infrastructure/terraform/validation/scripts/azure/run-azure-terraform-integration.sh "${args[@]}"
          }

          ACA_ARM_CLIENT_ID=""
          ACA_ARM_CLIENT_SECRET=""
          ACA_ARM_TENANT_ID=""
          ACA_ARM_SUBSCRIPTION_ID=""
          FUNCTIONS_ARM_CLIENT_ID=""
          FUNCTIONS_ARM_CLIENT_SECRET=""
          FUNCTIONS_ARM_TENANT_ID=""
          FUNCTIONS_ARM_SUBSCRIPTION_ID=""

          if [[ "$requested_stack" == "aca" || "$requested_stack" == "both" ]]; then
            bootstrap_azure_stack "aca"
            ACA_ARM_CLIENT_ID="$(read_bootstrap_output aca client_id)"
            ACA_ARM_CLIENT_SECRET="$(read_bootstrap_output aca client_secret)"
            ACA_ARM_TENANT_ID="$(read_bootstrap_output aca tenant_id)"
            ACA_ARM_SUBSCRIPTION_ID="$(read_bootstrap_output aca subscription_id)"
          fi

          if [[ "$requested_stack" == "functions" || "$requested_stack" == "both" ]]; then
            bootstrap_azure_stack "functions"
            FUNCTIONS_ARM_CLIENT_ID="$(read_bootstrap_output functions client_id)"
            FUNCTIONS_ARM_CLIENT_SECRET="$(read_bootstrap_output functions client_secret)"
            FUNCTIONS_ARM_TENANT_ID="$(read_bootstrap_output functions tenant_id)"
            FUNCTIONS_ARM_SUBSCRIPTION_ID="$(read_bootstrap_output functions subscription_id)"
          fi

          if [[ "$requested_stack" == "aca" || "$requested_stack" == "both" ]]; then
            run_validation_for_stack "aca" \
              "$ACA_ARM_CLIENT_ID" \
              "$ACA_ARM_CLIENT_SECRET" \
              "$ACA_ARM_TENANT_ID" \
              "$ACA_ARM_SUBSCRIPTION_ID"
          fi

          if [[ "$requested_stack" == "functions" || "$requested_stack" == "both" ]]; then
            run_validation_for_stack "functions" \
              "$FUNCTIONS_ARM_CLIENT_ID" \
              "$FUNCTIONS_ARM_CLIENT_SECRET" \
              "$FUNCTIONS_ARM_TENANT_ID" \
              "$FUNCTIONS_ARM_SUBSCRIPTION_ID"
          fi

      - name: Upload Azure plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/azure
          if-no-files-found: ignore

      - name: Detect Azure data reuse cache file
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live }}
        id: azure-data-cache
        shell: bash
        run: |
          set -euo pipefail
          cache_file="${{ github.workspace }}/.gha-cache/azure-data-reuse.env"
          if [[ -f "$cache_file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Azure data reuse cache file not present; skipping save."
          fi

      - name: Save Azure data reuse cache
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live && steps.azure-data-cache.outputs.exists == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/azure-data-reuse.env
          key: terraform-manual-validation-azure-data-${{ github.ref_name }}-${{ env.AZURE_VALIDATION_REGION }}-${{ github.run_id }}-${{ github.run_attempt }}

  aws-live:
    name: AWS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && (inputs.cloud == 'both' || inputs.cloud == 'aws') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      BOOTSTRAP_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BOOTSTRAP_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
      HONUA_AWS_ECS_IMAGE: ${{ vars.HONUA_AWS_ECS_IMAGE || '' }}
      HONUA_AWS_ECS_PREVIOUS_IMAGE: ${{ vars.HONUA_AWS_ECS_PREVIOUS_IMAGE || '' }}
      HONUA_AWS_ECS_CANARY_IMAGE: ${{ vars.HONUA_AWS_ECS_CANARY_IMAGE || '' }}
      HONUA_AWS_SERVERLESS_IMAGE: ${{ vars.HONUA_AWS_SERVERLESS_IMAGE || '' }}
      HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE: ${{ vars.HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE || '' }}
      HONUA_AWS_DATA_CACHE_FILE: ${{ github.workspace }}/.gha-cache/aws-data-reuse.env
      HONUA_PLATFORM_VALIDATION_SCRIPT: ${{ github.workspace }}/honua-server/scripts/run-cloud-post-apply-validation.sh
      HONUA_PLATFORM_VALIDATION_IMPORT_TABLE_PREFIX: ${{ inputs.deployment_profile == 'ephemeral' && inputs.no_destroy == false && format('cloud{0}{1}', github.run_id, github.run_attempt) || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Restore AWS data reuse cache
        if: ${{ inputs.reuse_data_stack && inputs.run_live }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/aws-data-reuse.env
          key: terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ env.AWS_VALIDATION_REGION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ env.AWS_VALIDATION_REGION }}-

      - name: Validate required credentials (AWS)
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BOOTSTRAP_AWS_ACCESS_KEY_ID
            BOOTSTRAP_AWS_SECRET_ACCESS_KEY
            HONUA_ADMIN_PASSWORD
            HONUA_DB_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret for AWS live validation: $name"
              exit 1
            fi
          done

          if [[ "$AWS_VALIDATION_STACK" == "ecs" || "$AWS_VALIDATION_STACK" == "both" ]]; then
            [[ -n "${HONUA_AWS_ECS_IMAGE:-}" ]] || { echo "Missing required AWS image configuration: HONUA_AWS_ECS_IMAGE"; exit 1; }
            if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
              [[ -n "${HONUA_AWS_ECS_PREVIOUS_IMAGE:-}" ]] || { echo "Missing required AWS image configuration: HONUA_AWS_ECS_PREVIOUS_IMAGE"; exit 1; }
            fi
          fi

          if [[ "$AWS_VALIDATION_STACK" == "serverless" || "$AWS_VALIDATION_STACK" == "both" ]]; then
            [[ -n "${HONUA_AWS_SERVERLESS_IMAGE:-}" ]] || { echo "Missing required AWS image configuration: HONUA_AWS_SERVERLESS_IMAGE"; exit 1; }
            if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
              [[ -n "${HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE:-}" ]] || { echo "Missing required AWS image configuration: HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE"; exit 1; }
            fi
          fi

      - name: Enforce persistent apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_profile }}" != "ephemeral" && "${{ inputs.apply_confirmation }}" != "APPROVED" ]]; then
            echo "Persistent profile requires apply_confirmation=APPROVED"
            exit 1
          fi

      - name: Bootstrap least-privilege identities and run AWS validation
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_root="$RUNNER_TEMP/bootstrap/aws"
          plan_root="$RUNNER_TEMP/plans/aws"
          mkdir -p "$bootstrap_root" "$plan_root"

          # Tag per-run bootstrap principals so the orphan sweeper can find
          # and expire them if this job dies before cleanup runs.
          bootstrap_expires_at="$(date -u -d "+${HONUA_TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          bootstrap_tags="{Owner=\"terraform-validation\",ValidationRunId=\"gha-${GITHUB_RUN_ID}-aws-bootstrap\",ExpiresAtUTC=\"${bootstrap_expires_at}\"}"

          requested_stack="$AWS_VALIDATION_STACK"
          case "$requested_stack" in
            ecs|serverless|both) ;;
            *)
              echo "Unsupported AWS_VALIDATION_STACK: $requested_stack"
              exit 1
              ;;
          esac

          cleanup_bootstrap_stack() {
            local stack="$1"
            local dir="$bootstrap_root/$stack"
            if [[ ! -f "$dir/terraform.tfstate" ]]; then
              return 0
            fi
            echo "Destroying AWS bootstrap identity for stack '$stack'"
            if ! AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
              AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
              terraform -chdir="$dir" destroy -input=false -auto-approve -no-color; then
              echo "Failed to destroy AWS bootstrap '$stack'" >&2
              return 1
            fi
          }

          cleanup_bootstrap() {
            local exit_code=$?
            local cleanup_failed=0

            cleanup_bootstrap_stack "ecs" || cleanup_failed=1
            cleanup_bootstrap_stack "serverless" || cleanup_failed=1

            if [[ "$cleanup_failed" -ne 0 && "$exit_code" -eq 0 ]]; then
              echo "AWS bootstrap cleanup failed" >&2
              exit_code=1
            fi

            exit "$exit_code"
          }
          trap cleanup_bootstrap EXIT

          bootstrap_aws_stack() {
            local stack="$1"
            local source_dir=""
            local target_dir="$bootstrap_root/$stack"
            local user_name=""

            case "$stack" in
              ecs)
                source_dir="infrastructure/terraform/bootstrap/aws-ecs"
                user_name="honua-tf-ecs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                ;;
              serverless)
                source_dir="infrastructure/terraform/bootstrap/aws-serverless"
                user_name="honua-tf-sls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                ;;
              *)
                echo "Unsupported bootstrap stack: $stack"
                exit 1
                ;;
            esac

            mkdir -p "$target_dir"
            cp "$source_dir"/*.tf "$target_dir"/

            AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
            AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
            terraform -chdir="$target_dir" init -input=false -no-color

            AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
            AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
            terraform -chdir="$target_dir" apply -input=false -auto-approve -no-color \
              -var "aws_region=${AWS_VALIDATION_REGION}" \
              -var "create_access_key=true" \
              -var "user_name=${user_name}" \
              -var "tags=${bootstrap_tags}"
          }

          read_bootstrap_output() {
            local stack="$1"
            local output_name="$2"
            terraform -chdir="$bootstrap_root/$stack" output -raw "$output_name"
          }

          run_validation_for_stack() {
            local stack="$1"
            local access_key_id="$2"
            local secret_access_key="$3"
            local stack_plan_dir="$plan_root/$stack"

            mkdir -p "$stack_plan_dir"

            args=(
              --stack "$stack"
              --region "$AWS_VALIDATION_REGION"
              --plan-artifact-dir "$stack_plan_dir"
              --max-run-cost-usd "$HONUA_MAX_RUN_COST_USD"
              --max-ready-seconds "$HONUA_READY_SLO_SECONDS"
              --max-load-error-rate "$HONUA_MAX_LOAD_ERROR_RATE_PERCENT"
              --ttl-hours "$HONUA_TTL_HOURS"
            )

            if [[ -n "$HONUA_AWS_NAME_PREFIX_BASE" ]]; then
              args+=(--name-prefix-base "$HONUA_AWS_NAME_PREFIX_BASE")
            fi

            if [[ "$stack" == "ecs" ]]; then
            if [[ -n "${HONUA_AWS_ECS_IMAGE:-}" ]]; then
              args+=(--ecs-image "$HONUA_AWS_ECS_IMAGE")
            fi
            if [[ "$HONUA_AWS_ECS_CANARY_ENABLED" == "true" ]]; then
              args+=(--ecs-canary-enabled)
              args+=(--ecs-canary-desired-count "$HONUA_AWS_ECS_CANARY_DESIRED_COUNT")
              args+=(--ecs-canary-weight "$HONUA_AWS_ECS_CANARY_WEIGHT_PERCENTAGE")
              args+=(--ecs-canary-header-name "$HONUA_AWS_ECS_CANARY_HEADER_NAME")
              args+=(--ecs-canary-header-value "$HONUA_AWS_ECS_CANARY_HEADER_VALUE")
              if [[ -n "${HONUA_AWS_ECS_CANARY_IMAGE:-}" ]]; then
                args+=(--ecs-canary-image "$HONUA_AWS_ECS_CANARY_IMAGE")
              fi
            fi
            if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
              args+=(--upgrade-rollback)
              if [[ -n "${HONUA_AWS_ECS_PREVIOUS_IMAGE:-}" ]]; then
                  args+=(--ecs-previous-image "$HONUA_AWS_ECS_PREVIOUS_IMAGE")
                fi
              fi
            fi

            if [[ "$stack" == "serverless" ]]; then
              if [[ -n "${HONUA_AWS_SERVERLESS_IMAGE:-}" ]]; then
                args+=(--serverless-image "$HONUA_AWS_SERVERLESS_IMAGE")
              fi
              if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
                args+=(--upgrade-rollback)
                if [[ -n "${HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE:-}" ]]; then
                  args+=(--serverless-previous-image "$HONUA_AWS_SERVERLESS_PREVIOUS_IMAGE")
                fi
              fi
            fi

            if [[ "$HONUA_SKIP_DB_RESILIENCE" == "true" ]]; then
              args+=(--skip-db-resilience)
            fi

            if [[ "$HONUA_SKIP_QUOTA_PREFLIGHT" == "true" ]]; then
              args+=(--skip-quota-preflight)
            fi

            if [[ "${{ inputs.allow_destroy_plan }}" == "true" ]]; then
              args+=(--allow-destroy-plan)
            fi

            if [[ "${{ inputs.no_destroy }}" == "true" ]]; then
              args+=(--no-destroy)
            elif [[ "${{ inputs.deployment_profile }}" == "ephemeral" ]]; then
              if [[ "${{ inputs.reuse_data_stack }}" == "true" ]]; then
                args+=(--keep-data)
              else
                args+=(--destroy-data)
              fi
            fi

            if [[ "$HONUA_SKIP_SCALE_CHECK" == "true" ]]; then
              args+=(--no-scale-check)
            fi

            if [[ "$HONUA_SKIP_IDEMPOTENCY" == "true" ]]; then
              args+=(--skip-idempotency)
            fi

            if [[ "$HONUA_SKIP_PROTOCOL_CHECKS" == "true" ]]; then
              args+=(--skip-protocol-checks)
            fi

            AWS_ACCESS_KEY_ID="$access_key_id" \
            AWS_SECRET_ACCESS_KEY="$secret_access_key" \
            AWS_SESSION_TOKEN="" \
            HONUA_VALIDATION_RUN_ID="gha-${{ github.run_id }}-aws-${stack}" \
            ./infrastructure/terraform/validation/scripts/aws/run-aws-terraform-integration.sh "${args[@]}"
          }

          ECS_AWS_ACCESS_KEY_ID=""
          ECS_AWS_SECRET_ACCESS_KEY=""
          SERVERLESS_AWS_ACCESS_KEY_ID=""
          SERVERLESS_AWS_SECRET_ACCESS_KEY=""

          if [[ "$requested_stack" == "ecs" || "$requested_stack" == "both" ]]; then
            bootstrap_aws_stack "ecs"
            ECS_AWS_ACCESS_KEY_ID="$(read_bootstrap_output ecs access_key_id)"
            ECS_AWS_SECRET_ACCESS_KEY="$(read_bootstrap_output ecs secret_access_key)"
          fi

          if [[ "$requested_stack" == "serverless" || "$requested_stack" == "both" ]]; then
            bootstrap_aws_stack "serverless"
            SERVERLESS_AWS_ACCESS_KEY_ID="$(read_bootstrap_output serverless access_key_id)"
            SERVERLESS_AWS_SECRET_ACCESS_KEY="$(read_bootstrap_output serverless secret_access_key)"
          fi

          if [[ "$requested_stack" == "ecs" || "$requested_stack" == "both" ]]; then
            run_validation_for_stack "ecs" \
              "$ECS_AWS_ACCESS_KEY_ID" \
              "$ECS_AWS_SECRET_ACCESS_KEY"
          fi

          if [[ "$requested_stack" == "serverless" || "$requested_stack" == "both" ]]; then
            run_validation_for_stack "serverless" \
              "$SERVERLESS_AWS_ACCESS_KEY_ID" \
              "$SERVERLESS_AWS_SECRET_ACCESS_KEY"
          fi

      - name: Upload AWS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/aws
          if-no-files-found: ignore

      - name: Detect AWS data reuse cache file
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live }}
        id: aws-data-cache
        shell: bash
        run: |
          set -euo pipefail
          cache_file="${{ github.workspace }}/.gha-cache/aws-data-reuse.env"
          if [[ -f "$cache_file" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "AWS data reuse cache file not present; skipping save."
          fi

      - name: Save AWS data reuse cache
        if: ${{ always() && inputs.reuse_data_stack && inputs.run_live && steps.aws-data-cache.outputs.exists == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.gha-cache/aws-data-reuse.env
          key: terraform-manual-validation-aws-data-${{ github.ref_name }}-${{ env.AWS_VALIDATION_REGION }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The in-step EXIT trap above cannot run to completion when the job is
      # cancelled or times out, which historically leaked per-run IAM users
      # with active access keys (#129). This step runs even on cancellation,
      # re-drives the bootstrap destroy from the state left on disk, and then
      # purges this run's bootstrap users by name so a crash before the state
      # file was written cannot strand credentials-bearing principals either.
      - name: Ensure bootstrap identities are destroyed (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${BOOTSTRAP_AWS_ACCESS_KEY_ID:-}" || -z "${BOOTSTRAP_AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "AWS bootstrap credentials not configured; nothing to clean up."
            exit 0
          fi

          export AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN"
          export AWS_REGION="$AWS_VALIDATION_REGION"
          export AWS_DEFAULT_REGION="$AWS_VALIDATION_REGION"

          status=0

          for stack in ecs serverless; do
            dir="$RUNNER_TEMP/bootstrap/aws/$stack"
            if [[ -f "$dir/terraform.tfstate" ]]; then
              echo "Ensuring AWS bootstrap identity for stack '$stack' is destroyed"
              terraform -chdir="$dir" destroy -input=false -auto-approve -no-color || status=1
            fi
          done

          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-validation-iam.sh \
            --user "honua-tf-ecs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --user "honua-tf-sls-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --protect-run-id "gha-${GITHUB_RUN_ID}-aws-ecs" \
            --protect-run-id "gha-${GITHUB_RUN_ID}-aws-serverless" \
            --protect-run-id "gha-${GITHUB_RUN_ID}-aws-bootstrap" \
            --skip-log-groups \
            || status=1

          exit "$status"

  k8s-live:
    name: Kubernetes Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_k8s }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      HONUA_K8S_IMAGE: ${{ vars.HONUA_K8S_IMAGE || '' }}
      HONUA_K8S_PREVIOUS_IMAGE: ${{ vars.HONUA_K8S_PREVIOUS_IMAGE || '' }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install k3d
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/b481dca24e34145edcdd14de72ebe4f56ec8e8bc/install.sh | bash
          k3d version

      - name: Validate required credentials (Kubernetes)
        shell: bash
        run: |
          set -euo pipefail
          required=(
            HONUA_ADMIN_PASSWORD
            HONUA_K8S_IMAGE
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required Kubernetes configuration: $name"
              exit 1
            fi
          done

          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" && -z "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
            echo "Missing required Kubernetes configuration: HONUA_K8S_PREVIOUS_IMAGE"
            exit 1
          fi

      - name: Enforce persistent apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_profile }}" != "ephemeral" && "${{ inputs.apply_confirmation }}" != "APPROVED" ]]; then
            echo "Persistent profile requires apply_confirmation=APPROVED"
            exit 1
          fi

      - name: Run Kubernetes live integration script
        shell: bash
        run: |
          set -euo pipefail

          args=(
            --max-ready-seconds "$HONUA_READY_SLO_SECONDS"
            --max-load-error-rate "$HONUA_MAX_LOAD_ERROR_RATE_PERCENT"
          )

          if [[ -n "${HONUA_K8S_IMAGE:-}" ]]; then
            args+=(--image "$HONUA_K8S_IMAGE")
          fi

          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
            args+=(--upgrade-rollback)
            if [[ -n "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
              args+=(--previous-image "$HONUA_K8S_PREVIOUS_IMAGE")
            fi
          fi

          if [[ "$HONUA_SKIP_OBSERVABILITY" == "true" ]]; then
            args+=(--skip-observability)
          fi

          if [[ "$HONUA_SKIP_DB_RESILIENCE" == "true" ]]; then
            args+=(--skip-db-resilience)
          fi

          if [[ "$HONUA_SKIP_HELM_STATIC_VALIDATION" == "true" ]]; then
            args+=(--skip-helm-static-validation)
          fi

          if [[ "${{ inputs.no_destroy }}" == "true" ]]; then
            args+=(--no-destroy)
          fi

          if [[ "$HONUA_SKIP_SCALE_CHECK" == "true" ]]; then
            args+=(--no-scale-check)
          fi

          if [[ "$HONUA_SKIP_IDEMPOTENCY" == "true" ]]; then
            args+=(--skip-idempotency)
          fi

          if [[ "$HONUA_SKIP_PROTOCOL_CHECKS" == "true" ]]; then
            args+=(--skip-protocol-checks)
          fi

          ./infrastructure/terraform/validation/scripts/k8s/run-k8s-terraform-integration.sh "${args[@]}"

  aks-live:
    name: AKS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_aks && (inputs.cloud == 'both' || inputs.cloud == 'azure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      BOOTSTRAP_ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      BOOTSTRAP_ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      BOOTSTRAP_ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_K8S_IMAGE: ${{ vars.HONUA_AKS_IMAGE || vars.HONUA_K8S_IMAGE || '' }}
      HONUA_K8S_PREVIOUS_IMAGE: ${{ vars.HONUA_K8S_PREVIOUS_IMAGE || '' }}
      HONUA_AZURE_REGISTRY_RESOURCE_ID: ${{ vars.HONUA_AZURE_REGISTRY_RESOURCE_ID || '' }}
      HONUA_AZURE_REGISTRY_USERNAME: ${{ secrets.HONUA_AZURE_REGISTRY_USERNAME || '' }}
      HONUA_AZURE_REGISTRY_PASSWORD: ${{ secrets.HONUA_AZURE_REGISTRY_PASSWORD || '' }}
      HONUA_PLATFORM_VALIDATION_SCRIPT: ${{ github.workspace }}/honua-server/scripts/run-cloud-post-apply-validation.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate required secrets (AKS)
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BOOTSTRAP_ARM_CLIENT_ID
            BOOTSTRAP_ARM_CLIENT_SECRET
            BOOTSTRAP_ARM_TENANT_ID
            BOOTSTRAP_ARM_SUBSCRIPTION_ID
            HONUA_ADMIN_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret for AKS live validation: $name"
              exit 1
            fi
          done

          [[ -n "${HONUA_K8S_IMAGE:-}" ]] || { echo "Missing required secret for AKS live validation: HONUA_K8S_IMAGE"; exit 1; }
          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" && -z "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
            echo "Missing required secret for AKS live validation: HONUA_K8S_PREVIOUS_IMAGE"
            exit 1
          fi

      - name: Enforce persistent apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_profile }}" != "ephemeral" && "${{ inputs.apply_confirmation }}" != "APPROVED" ]]; then
            echo "Persistent profile requires apply_confirmation=APPROVED"
            exit 1
          fi

      - name: Bootstrap least-privilege identity and run AKS validation
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_dir="$RUNNER_TEMP/bootstrap/aks"
          plan_dir="$RUNNER_TEMP/plans/aks"
          mkdir -p "$bootstrap_dir" "$plan_dir"

          cleanup_bootstrap() {
            local exit_code=$?

            if [[ ! -f "$bootstrap_dir/terraform.tfstate" ]]; then
              exit "$exit_code"
            fi
            echo "Destroying AKS bootstrap identity"
            if ! ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
              ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
              ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
              ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
              terraform -chdir="$bootstrap_dir" destroy -input=false -auto-approve -no-color; then
              echo "Failed to destroy AKS bootstrap identity" >&2
              exit 1
            fi

            exit "$exit_code"
          }
          trap cleanup_bootstrap EXIT

          cp infrastructure/terraform/bootstrap/azure-aks/*.tf "$bootstrap_dir"/

          ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
          ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
          ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
          ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
          terraform -chdir="$bootstrap_dir" init -input=false -no-color

          ARM_CLIENT_ID="$BOOTSTRAP_ARM_CLIENT_ID" \
          ARM_CLIENT_SECRET="$BOOTSTRAP_ARM_CLIENT_SECRET" \
          ARM_TENANT_ID="$BOOTSTRAP_ARM_TENANT_ID" \
          ARM_SUBSCRIPTION_ID="$BOOTSTRAP_ARM_SUBSCRIPTION_ID" \
          terraform -chdir="$bootstrap_dir" apply -input=false -auto-approve -no-color \
            -var "app_name=honua-tf-aks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -var "role_name=Honua TF AKS ${GITHUB_RUN_ID} ${GITHUB_RUN_ATTEMPT}"

          AKS_ARM_CLIENT_ID="$(terraform -chdir="$bootstrap_dir" output -raw client_id)"
          AKS_ARM_CLIENT_SECRET="$(terraform -chdir="$bootstrap_dir" output -raw client_secret)"
          AKS_ARM_TENANT_ID="$(terraform -chdir="$bootstrap_dir" output -raw tenant_id)"
          AKS_ARM_SUBSCRIPTION_ID="$(terraform -chdir="$bootstrap_dir" output -raw subscription_id)"

          args=(
            --location "$AZURE_VALIDATION_REGION"
            --plan-artifact-dir "$plan_dir"
            --max-run-cost-usd "$HONUA_MAX_RUN_COST_USD"
            --max-ready-seconds "$HONUA_READY_SLO_SECONDS"
            --max-load-error-rate "$HONUA_MAX_LOAD_ERROR_RATE_PERCENT"
            --ttl-hours "$HONUA_TTL_HOURS"
          )

          if [[ -n "$HONUA_AKS_NAME_PREFIX_BASE" ]]; then
            args+=(--name-prefix-base "$HONUA_AKS_NAME_PREFIX_BASE")
          fi

          if [[ -n "${HONUA_K8S_IMAGE:-}" ]]; then
            args+=(--image "$HONUA_K8S_IMAGE")
          fi

          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
            args+=(--upgrade-rollback)
            if [[ -n "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
              args+=(--previous-image "$HONUA_K8S_PREVIOUS_IMAGE")
            fi
          fi

          if [[ "$HONUA_SKIP_OBSERVABILITY" == "true" ]]; then
            args+=(--skip-observability)
          fi

          if [[ "$HONUA_SKIP_DB_RESILIENCE" == "true" ]]; then
            args+=(--skip-db-resilience)
          fi

          if [[ "$HONUA_SKIP_HELM_STATIC_VALIDATION" == "true" ]]; then
            args+=(--skip-helm-static-validation)
          fi

          if [[ "$HONUA_SKIP_QUOTA_PREFLIGHT" == "true" ]]; then
            args+=(--skip-quota-preflight)
          fi

          if [[ "${{ inputs.allow_destroy_plan }}" == "true" ]]; then
            args+=(--allow-destroy-plan)
          fi

          if [[ "${{ inputs.no_destroy }}" == "true" ]]; then
            args+=(--no-destroy)
          fi

          if [[ "$HONUA_SKIP_SCALE_CHECK" == "true" ]]; then
            args+=(--no-scale-check)
          fi

          if [[ "$HONUA_SKIP_IDEMPOTENCY" == "true" ]]; then
            args+=(--skip-idempotency)
          fi

          if [[ "$HONUA_SKIP_PROTOCOL_CHECKS" == "true" ]]; then
            args+=(--skip-protocol-checks)
          fi

          ARM_CLIENT_ID="$AKS_ARM_CLIENT_ID" \
          ARM_CLIENT_SECRET="$AKS_ARM_CLIENT_SECRET" \
          ARM_TENANT_ID="$AKS_ARM_TENANT_ID" \
          ARM_SUBSCRIPTION_ID="$AKS_ARM_SUBSCRIPTION_ID" \
          HONUA_VALIDATION_RUN_ID="gha-${{ github.run_id }}-aks" \
          ./infrastructure/terraform/validation/scripts/azure/run-aks-terraform-integration.sh "${args[@]}"

      - name: Upload AKS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aks-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/aks
          if-no-files-found: ignore

  eks-live:
    name: EKS Live Validation
    needs: policy-gates
    if: ${{ inputs.run_live && inputs.run_eks && (inputs.cloud == 'both' || inputs.cloud == 'aws') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: ${{ inputs.deployment_profile == 'persistent' && 'terraform-live-approval' || 'terraform-ephemeral' }}
    env:
      BOOTSTRAP_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      BOOTSTRAP_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      BOOTSTRAP_AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_K8S_IMAGE: ${{ vars.HONUA_EKS_IMAGE || vars.HONUA_K8S_IMAGE || '' }}
      HONUA_K8S_PREVIOUS_IMAGE: ${{ vars.HONUA_K8S_PREVIOUS_IMAGE || '' }}
      HONUA_PLATFORM_VALIDATION_SCRIPT: ${{ github.workspace }}/honua-server/scripts/run-cloud-post-apply-validation.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Checkout honua-server platform validation suite
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-server
          path: honua-server

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validate required secrets (EKS)
        shell: bash
        run: |
          set -euo pipefail
          required=(
            BOOTSTRAP_AWS_ACCESS_KEY_ID
            BOOTSTRAP_AWS_SECRET_ACCESS_KEY
            HONUA_ADMIN_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret for EKS live validation: $name"
              exit 1
            fi
          done

          [[ -n "${HONUA_K8S_IMAGE:-}" ]] || { echo "Missing required secret for EKS live validation: HONUA_K8S_IMAGE"; exit 1; }
          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" && -z "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
            echo "Missing required secret for EKS live validation: HONUA_K8S_PREVIOUS_IMAGE"
            exit 1
          fi

      - name: Enforce persistent apply confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.deployment_profile }}" != "ephemeral" && "${{ inputs.apply_confirmation }}" != "APPROVED" ]]; then
            echo "Persistent profile requires apply_confirmation=APPROVED"
            exit 1
          fi

      - name: Bootstrap least-privilege identity and run EKS validation
        shell: bash
        run: |
          set -euo pipefail

          bootstrap_dir="$RUNNER_TEMP/bootstrap/eks"
          plan_dir="$RUNNER_TEMP/plans/eks"
          mkdir -p "$bootstrap_dir" "$plan_dir"

          cleanup_bootstrap() {
            local exit_code=$?

            if [[ ! -f "$bootstrap_dir/terraform.tfstate" ]]; then
              exit "$exit_code"
            fi
            echo "Destroying EKS bootstrap identity"
            if ! AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
              AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
              AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
              terraform -chdir="$bootstrap_dir" destroy -input=false -auto-approve -no-color; then
              echo "Failed to destroy EKS bootstrap identity" >&2
              exit 1
            fi

            exit "$exit_code"
          }
          trap cleanup_bootstrap EXIT

          cp infrastructure/terraform/bootstrap/aws-eks/*.tf "$bootstrap_dir"/

          # Tag the per-run bootstrap principal so the orphan sweeper can find
          # and expire it if this job dies before cleanup runs.
          bootstrap_expires_at="$(date -u -d "+${HONUA_TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          bootstrap_tags="{Owner=\"terraform-validation\",ValidationRunId=\"gha-${GITHUB_RUN_ID}-eks-bootstrap\",ExpiresAtUTC=\"${bootstrap_expires_at}\"}"

          AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
          AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
          terraform -chdir="$bootstrap_dir" init -input=false -no-color

          AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY" \
          AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN" \
          terraform -chdir="$bootstrap_dir" apply -input=false -auto-approve -no-color \
            -var "aws_region=${AWS_VALIDATION_REGION}" \
            -var "create_access_key=true" \
            -var "user_name=honua-tf-eks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -var "tags=${bootstrap_tags}"

          EKS_AWS_ACCESS_KEY_ID="$(terraform -chdir="$bootstrap_dir" output -raw access_key_id)"
          EKS_AWS_SECRET_ACCESS_KEY="$(terraform -chdir="$bootstrap_dir" output -raw secret_access_key)"

          args=(
            --region "$AWS_VALIDATION_REGION"
            --plan-artifact-dir "$plan_dir"
            --max-run-cost-usd "$HONUA_MAX_RUN_COST_USD"
            --max-ready-seconds "$HONUA_READY_SLO_SECONDS"
            --max-load-error-rate "$HONUA_MAX_LOAD_ERROR_RATE_PERCENT"
            --ttl-hours "$HONUA_TTL_HOURS"
          )

          if [[ -n "$HONUA_EKS_NAME_PREFIX_BASE" ]]; then
            args+=(--name-prefix-base "$HONUA_EKS_NAME_PREFIX_BASE")
          fi

          if [[ -n "${HONUA_K8S_IMAGE:-}" ]]; then
            args+=(--image "$HONUA_K8S_IMAGE")
          fi

          if [[ "$HONUA_RUN_UPGRADE_ROLLBACK" == "true" ]]; then
            args+=(--upgrade-rollback)
            if [[ -n "${HONUA_K8S_PREVIOUS_IMAGE:-}" ]]; then
              args+=(--previous-image "$HONUA_K8S_PREVIOUS_IMAGE")
            fi
          fi

          if [[ "$HONUA_SKIP_OBSERVABILITY" == "true" ]]; then
            args+=(--skip-observability)
          fi

          if [[ "$HONUA_SKIP_DB_RESILIENCE" == "true" ]]; then
            args+=(--skip-db-resilience)
          fi

          if [[ "$HONUA_SKIP_HELM_STATIC_VALIDATION" == "true" ]]; then
            args+=(--skip-helm-static-validation)
          fi

          if [[ "$HONUA_SKIP_QUOTA_PREFLIGHT" == "true" ]]; then
            args+=(--skip-quota-preflight)
          fi

          if [[ "${{ inputs.allow_destroy_plan }}" == "true" ]]; then
            args+=(--allow-destroy-plan)
          fi

          if [[ "${{ inputs.no_destroy }}" == "true" ]]; then
            args+=(--no-destroy)
          fi

          if [[ "$HONUA_SKIP_SCALE_CHECK" == "true" ]]; then
            args+=(--no-scale-check)
          fi

          if [[ "$HONUA_SKIP_IDEMPOTENCY" == "true" ]]; then
            args+=(--skip-idempotency)
          fi

          if [[ "$HONUA_SKIP_PROTOCOL_CHECKS" == "true" ]]; then
            args+=(--skip-protocol-checks)
          fi

          AWS_ACCESS_KEY_ID="$EKS_AWS_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$EKS_AWS_SECRET_ACCESS_KEY" \
          AWS_SESSION_TOKEN="" \
          HONUA_VALIDATION_RUN_ID="gha-${{ github.run_id }}-eks" \
          ./infrastructure/terraform/validation/scripts/aws/run-eks-terraform-integration.sh "${args[@]}"

      - name: Upload EKS plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eks-plan-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/plans/eks
          if-no-files-found: ignore

      # The in-step EXIT trap above cannot run to completion when the job is
      # cancelled or times out, which historically leaked per-run IAM users
      # with active access keys (#129). This step runs even on cancellation,
      # re-drives the bootstrap destroy from the state left on disk, and then
      # purges this run's bootstrap user by name so a crash before the state
      # file was written cannot strand a credentials-bearing principal either.
      - name: Ensure bootstrap identity is destroyed (always)
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          if [[ -z "${BOOTSTRAP_AWS_ACCESS_KEY_ID:-}" || -z "${BOOTSTRAP_AWS_SECRET_ACCESS_KEY:-}" ]]; then
            echo "AWS bootstrap credentials not configured; nothing to clean up."
            exit 0
          fi

          export AWS_ACCESS_KEY_ID="$BOOTSTRAP_AWS_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$BOOTSTRAP_AWS_SECRET_ACCESS_KEY"
          export AWS_SESSION_TOKEN="$BOOTSTRAP_AWS_SESSION_TOKEN"
          export AWS_REGION="$AWS_VALIDATION_REGION"
          export AWS_DEFAULT_REGION="$AWS_VALIDATION_REGION"

          status=0

          dir="$RUNNER_TEMP/bootstrap/eks"
          if [[ -f "$dir/terraform.tfstate" ]]; then
            echo "Ensuring EKS bootstrap identity is destroyed"
            terraform -chdir="$dir" destroy -input=false -auto-approve -no-color || status=1
          fi

          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-validation-iam.sh \
            --user "honua-tf-eks-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --protect-run-id "gha-${GITHUB_RUN_ID}-eks" \
            --protect-run-id "gha-${GITHUB_RUN_ID}-eks-bootstrap" \
            --skip-log-groups \
            || status=1

          exit "$status"

  drift-detect:
    name: Terraform Drift Detection
    needs: policy-gates
    if: ${{ inputs.run_drift }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Run drift detection
        shell: bash
        run: |
          set -euo pipefail

          drift_dir="$RUNNER_TEMP/drift"
          mkdir -p "$drift_dir"

          args=(--plan-artifact-dir "$drift_dir")

          roots_csv="$HONUA_DRIFT_ROOTS"
          if [[ -z "$roots_csv" ]]; then
            roots=()

            if [[ "${{ inputs.cloud }}" == "both" || "${{ inputs.cloud }}" == "azure" ]]; then
              roots+=(
                "infrastructure/terraform/examples/azure"
                "infrastructure/terraform/examples/azure-functions"
              )
              if [[ "${{ inputs.run_aks }}" == "true" ]]; then
                roots+=("infrastructure/terraform/examples/azure-aks")
              fi
            fi

            if [[ "${{ inputs.cloud }}" == "both" || "${{ inputs.cloud }}" == "aws" ]]; then
              roots+=(
                "infrastructure/terraform/examples/aws"
                "infrastructure/terraform/examples/aws-serverless"
              )
              if [[ "${{ inputs.run_eks }}" == "true" ]]; then
                roots+=("infrastructure/terraform/examples/aws-eks")
              fi
            fi

            roots+=("infrastructure/terraform/examples/observability")
            roots_csv="$(IFS=','; echo "${roots[*]}")"
          fi

          IFS=',' read -ra roots <<< "$roots_csv"
          for root in "${roots[@]}"; do
            root_trimmed="$(echo "$root" | xargs)"
            [[ -z "$root_trimmed" ]] && continue
            args+=(--root "$root_trimmed")
          done

          if [[ "$HONUA_DRIFT_VAR_FILES" != "" ]]; then
            IFS=',' read -ra varfiles <<< "$HONUA_DRIFT_VAR_FILES"
            for vf in "${varfiles[@]}"; do
              vf_trimmed="$(echo "$vf" | xargs)"
              [[ -z "$vf_trimmed" ]] && continue
              args+=(--var-file "$vf_trimmed")
            done
          fi

          ./infrastructure/terraform/validation/scripts/shared/run-terraform-drift-detection.sh "${args[@]}"

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/drift
          if-no-files-found: ignore
