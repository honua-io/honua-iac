name: Terraform Validation IAM Sweeper

# Scheduled janitor for per-run IAM principals leaked by
# terraform-manual-validation (#129). The in-job cleanup steps handle the
# normal and cancelled paths; this sweeper is the backstop for runner loss and
# any other path where nothing on the runner got a chance to execute. It
# deletes:
#   - IAM users honua-tf-* whose ExpiresAtUTC tag has elapsed (or, for
#     untagged historical users, older than the age threshold), deactivating
#     and deleting their access keys first;
#   - IAM roles and customer-managed policies tagged
#     Owner=terraform-validation with an elapsed ExpiresAtUTC;
#   - orphaned Container Insights log groups from validation clusters.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List orphans without deleting anything"
        required: true
        type: boolean
        default: false
      max_age_hours:
        description: "Age threshold (hours) for untagged honua-tf-* resources"
        required: false
        type: string
        default: "24"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-validation-iam-sweeper
  cancel-in-progress: false

jobs:
  # The schedule fires on every trunk head whether or not the operator has
  # provisioned the cleanup role yet. An unprovisioned role is an absent
  # environment, not a failed cleanup: report it here and let the sweeper job
  # conclude `skipped` (honua-release#376 R18/R21) instead of reddening the
  # head. This is the ONLY condition that skips the sweeper; once the variable is
  # set every run assumes the role exactly as before.
  precondition:
    name: Require sweeper OIDC role
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.role.outputs.configured }}
    steps:
      - name: Check HONUA_AWS_VALIDATION_IAM_SWEEPER_ROLE_ARN
        id: role
        env:
          ROLE_ARN: ${{ vars.HONUA_AWS_VALIDATION_IAM_SWEEPER_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ROLE_ARN}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reason="SKIPPED: HONUA_AWS_VALIDATION_IAM_SWEEPER_ROLE_ARN is not set; provision the #208 OIDC cleanup role (scoped role with the standing/demo teardown deny) and set the repository variable to run the sweeper."
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=sweeper skipped::${reason}"
          echo "${reason}" >> "$GITHUB_STEP_SUMMARY"

  sweep:
    name: Sweep orphaned validation IAM principals
    needs: precondition
    if: ${{ needs.precondition.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: ${{ vars.HONUA_AWS_VALIDATION_REGION || 'us-east-1' }}
      HONUA_AWS_SWEEP_REGIONS: ${{ vars.HONUA_AWS_SWEEP_REGIONS || 'us-east-1,us-west-2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require OIDC role
        env:
          ROLE_ARN: ${{ vars.HONUA_AWS_VALIDATION_IAM_SWEEPER_ROLE_ARN }}
        run: ': "${ROLE_ARN:?Configure the OIDC cleanup role ARN}"'

      - name: Configure AWS OIDC session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HONUA_AWS_VALIDATION_IAM_SWEEPER_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
          role-duration-seconds: 7200
          unset-current-credentials: true

      - name: Sweep orphaned validation IAM principals and log groups
        shell: bash
        run: |
          set -euo pipefail


          max_age_hours="${{ inputs.max_age_hours || '24' }}"
          args=(--max-age-hours "$max_age_hours")

          IFS=',' read -ra regions <<< "$HONUA_AWS_SWEEP_REGIONS"
          for region in "${regions[@]}"; do
            region="$(echo "$region" | xargs)"
            [[ -z "$region" ]] && continue
            args+=(--region "$region")
          done

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          ./infrastructure/terraform/validation/scripts/aws/sweep-orphaned-validation-iam.sh "${args[@]}"
