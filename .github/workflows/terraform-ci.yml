      - 'scripts/terraform-plan-report.py'
      - '.github/workflows/bootstrap-drift-plan.yml'
      - 'scripts/package-customer-dist.sh'
      - 'scripts/new-terraform-lineage-contract.ps1'
      - 'scripts/terraform-exact-plan.sh'
      - 'scripts/terraform-exact-apply.sh'
      - 'scripts/terraform-backend-identity.sh'
      - 'scripts/lib/tf-exec-contract.sh'
      - 'scripts/smoke-customer-dist.sh'
      - 'scripts/capture-dr-drill-evidence.sh'
      - 'scripts/capture-runbook-evidence.sh'
      - 'scripts/tf-pass-secrets.sh'
      - 'scripts/lib/tf-secret-catalog.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'scripts/write-cloud-demo-smoke-env-summary.mjs'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/aws-deployment-safety.md'
      - 'docs/devops/terraform-exact-plan-contract.md'
      - 'docs/devops/backup-restore-runbook.md'
      - 'docs/devops/failover-drill-runbook.md'
      - 'docs/devops/manual-cloud-runbook-validation.md'
      - 'docs/devops/dr-evidence-template.json'
      - 'docs/devops/cloud-runbook-evidence-template.json'
      - 'docs/devops/examples/**'
      - 'docs/operator-deployment.md'
      - 'docs/operator-contract.md'
      - 'docs/operator-state.md'
      - '.github/workflows/cloud-demo-smoke.yml'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'
      - '.github/workflows/terraform-validation-infra-reaper.yml'
      - '.github/workflows/terraform-validation-iam-sweeper.yml'
      - '.github/workflows/release-cell-inventory-policy.yml'
      - 'tests/workflows/**'
  push:
    branches:
      - trunk
    paths:
      - 'infrastructure/terraform/**'
      - 'release/aws-cert-plan-recipient.json'
      - 'release/aws-cert-reviewed-modules.json'
      - 'release/aws-cert-reviewed-bootstrap.json'
      - 'release/component-versions.json'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/validate-operator-contract.sh'
      - 'scripts/test-operator-contract.sh'
      - 'scripts/check-marketplace-paths.sh'
      - 'scripts/check-tfvars-examples.sh'
      - 'scripts/bootstrap-gh-vars.sh'
      - 'scripts/check-backend-examples.sh'
      - 'scripts/bootstrap-drift-roots.py'
      - 'scripts/terraform-plan-report.py'
      - '.github/workflows/bootstrap-drift-plan.yml'
      - 'scripts/package-customer-dist.sh'
      - 'scripts/new-terraform-lineage-contract.ps1'
      - 'scripts/terraform-exact-plan.sh'
      - 'scripts/terraform-exact-apply.sh'
      - 'scripts/terraform-backend-identity.sh'
      - 'scripts/lib/tf-exec-contract.sh'
      - 'scripts/smoke-customer-dist.sh'
      - 'scripts/capture-dr-drill-evidence.sh'
      - 'scripts/capture-runbook-evidence.sh'
      - 'scripts/tf-pass-secrets.sh'
      - 'scripts/lib/tf-secret-catalog.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'scripts/write-cloud-demo-smoke-env-summary.mjs'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/aws-deployment-safety.md'
      - 'docs/devops/terraform-exact-plan-contract.md'
      - 'docs/devops/backup-restore-runbook.md'
      - 'docs/devops/failover-drill-runbook.md'
      - 'docs/devops/manual-cloud-runbook-validation.md'
      - 'docs/devops/dr-evidence-template.json'
      - 'docs/devops/cloud-runbook-evidence-template.json'
      - 'docs/devops/examples/**'
      - 'docs/operator-deployment.md'
      - 'docs/operator-contract.md'
      - 'docs/operator-state.md'
      - '.github/workflows/cloud-demo-smoke.yml'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'
      - '.github/workflows/terraform-validation-infra-reaper.yml'
      - '.github/workflows/terraform-validation-iam-sweeper.yml'
      - '.github/workflows/release-cell-inventory-policy.yml'
      - 'tests/workflows/**'

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  standing-cert-encryption-controls:
    name: Standing certification encrypted packet controls (synthetic keys)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned maintained encryption tools
        run: |
          install -d -m 700 "$RUNNER_TEMP/cert-plan-tools"
          python3 infrastructure/terraform/validation/scripts/aws/cert_plan_envelope.py install-tools --directory "$RUNNER_TEMP/cert-plan-tools"
      - name: Run real encryption and exact-run receiver controls
        env:
          HONUA_CERT_TEST_TOOLS: ${{ runner.temp }}/cert-plan-tools
        run: python3 infrastructure/terraform/validation/scripts/aws/test_cert_plan_envelope.py -v

  standing-cert-plan-controls:
    name: Standing certification private plan controls (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 infrastructure/terraform/validation/scripts/aws/test_standing_cert_plan.py -v
      - run: python3 infrastructure/terraform/validation/scripts/aws/test_verify_reviewed_modules.py -v
      - run: python3 infrastructure/terraform/validation/scripts/aws/test_restore_reviewed_bootstrap.py -v

  terraform-1-5-validate:
    name: Terraform 1.5 Floor Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Restore Terraform plugin cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-1.5-plugin-cache-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-1.5-plugin-cache-${{ runner.os }}-

      - name: Ensure Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform 1.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7

      - name: Terraform init/validate at declared floor
        shell: bash
        run: |
          set -euo pipefail

          roots=(
            "infrastructure/terraform/internal/aws-agent-controller"
            "infrastructure/terraform/internal/aws-agent-worker"
            "infrastructure/terraform/examples/aws"
            "infrastructure/terraform/examples/aws-serverless"
            "infrastructure/terraform/examples/azure"
            "infrastructure/terraform/examples/azure-functions"
            "infrastructure/terraform/modules/aws-serverless"
          )

          for root in "${roots[@]}"; do
            echo "::group::terraform 1.5 init ($root)"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            echo "::endgroup::"

            echo "::group::terraform 1.5 validate ($root)"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done

      - name: Operator tfvars example contract at declared floor
        shell: bash
        run: ./scripts/check-tfvars-examples.sh

  static-validate:
    name: Static Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Enforce maintained documentation command policy
        run: |
          if git grep -n -i -w curl -- '*.md' '*.mdx' '*.rst' '*.txt'; then
            echo "::error::Maintained documentation must use supported SDK, CLI, or API-reference workflows."
            exit 1
          fi

      - name: Restore Terraform plugin cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugin-cache-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugin-cache-${{ runner.os }}-

      - name: Ensure Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          terraform fmt -check -recursive docs/devops/examples

      - name: Configure git to fetch the Git-source module via the workflow token
        # The registry-pin example consumes the module over https git from this
        # (private) repo. Anonymous clone fails ("could not read Username"), so
        # rewrite github.com URLs to use the read-only GITHUB_TOKEN.
        env:
          GH_WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GH_WORKFLOW_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Terraform init/validate (selected roots)
        shell: bash
        env:
          # Validate the Git-source consumer against the exact PR head (or push
          # commit), not the older trunk contract that the checked-in operator
          # example intentionally pins between releases.
          HONUA_REGISTRY_PIN_VALIDATION_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          # Rewrite whatever ref the example pins (a release tag) to the commit
          # under test, then prove the rewrite happened.
          sed -i "/modules\/aws-ecs?ref=/s/ref=[^\"]*\"/ref=${HONUA_REGISTRY_PIN_VALIDATION_REF}\"/" \
            infrastructure/terraform/examples/registry-pin/main.tf
          grep -q "modules/aws-ecs?ref=${HONUA_REGISTRY_PIN_VALIDATION_REF}\"" \
            infrastructure/terraform/examples/registry-pin/main.tf

          roots=(
            "infrastructure/terraform/bootstrap/azure-aca"
            "infrastructure/terraform/bootstrap/azure-functions"
            "infrastructure/terraform/bootstrap/azure-aks"
            "infrastructure/terraform/bootstrap/azure-support-access"
            "infrastructure/terraform/bootstrap/aws-ecs"
            "infrastructure/terraform/bootstrap/aws-tfstate"
            "infrastructure/terraform/bootstrap/aws-terraform-oidc"
            "infrastructure/terraform/bootstrap/aws-release-cells"
            "infrastructure/terraform/bootstrap/aws-validation-reaper"
            "infrastructure/terraform/bootstrap/aws-drift-plan"
            "infrastructure/terraform/bootstrap/aws-exec-identity"
            "infrastructure/terraform/bootstrap/aws-serverless"
            "infrastructure/terraform/bootstrap/aws-eks"
            "infrastructure/terraform/bootstrap/aws-support-access"
            "infrastructure/terraform/examples/azure"
            "infrastructure/terraform/examples/azure-data"
            "infrastructure/terraform/examples/azure-functions"
            "infrastructure/terraform/examples/aws"
            "infrastructure/terraform/examples/aws-serverless"
            "infrastructure/terraform/examples/aws-cert"
            "infrastructure/terraform/examples/azure-cert"
            "infrastructure/terraform/examples/aws-data"
            "infrastructure/terraform/examples/azure-aks"
            "infrastructure/terraform/examples/aws-eks"
            "infrastructure/terraform/examples/aws-eks-native"
            "infrastructure/terraform/examples/observability"
            # Git-source external-consumer example. Unlike the other roots its
            # module is fetched from the repo over the network at the pinned
            # ?ref=, so this validates the published consumer contract too.
            "infrastructure/terraform/examples/registry-pin"
            "infrastructure/terraform/modules/azure-aca"
            "infrastructure/terraform/modules/azure-gp"
            "infrastructure/terraform/modules/azure-data"
            "infrastructure/terraform/modules/azure-functions"
            "infrastructure/terraform/modules/aws-ecs"
            "infrastructure/terraform/modules/aws-serverless"
            "infrastructure/terraform/modules/aws-data"
            "infrastructure/terraform/modules/azure-aks"
            "infrastructure/terraform/modules/aws-eks"
            "infrastructure/terraform/modules/observability-stack"
            "infrastructure/terraform/components/cloud-demo-smoke-credentials"
            "infrastructure/terraform/components/aws-github-oidc"
            "infrastructure/terraform/internal/gtm-forms-router"
            "infrastructure/terraform/internal/aws-agent-controller"
            "infrastructure/terraform/internal/aws-agent-worker"
            "docs/devops/examples"
          )

          for root in "${roots[@]}"; do
            echo "::group::terraform init ($root)"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            echo "::endgroup::"

            echo "::group::terraform validate ($root)"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done

      - name: Lambda secret-policy publication order contract
        run: python3 infrastructure/terraform/validation/scripts/shared/test-lambda-secret-policy-order.py

      - name: Agent container isolation contracts (mock providers only)
        run: terraform -chdir=infrastructure/terraform/internal/aws-agent-worker test -no-color

      - name: Agent controller state contracts (mock providers only)
        run: terraform -chdir=infrastructure/terraform/internal/aws-agent-controller test -no-color

      - name: Installed worker JSONata constraints (synthetic mock state only)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installed-slot-control"
          terraform -chdir=infrastructure/terraform/internal/aws-agent-worker test -filter=tests/installed.tftest.hcl -verbose -json > "$RUNNER_TEMP/installed-slot-control/worker.mock.jsonl"
          npm ci --ignore-scripts --prefix infrastructure/terraform/internal/aws-agent-worker/tests/jsonata
          node infrastructure/terraform/internal/aws-agent-worker/tests/jsonata/constraints.mjs "$RUNNER_TEMP/installed-slot-control/worker.mock.jsonl"

      - name: Retain synthetic installed worker controls
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-installed-worker-controls-${{ github.run_id }}
          path: ${{ runner.temp }}/installed-slot-control/
          retention-days: 3
          if-no-files-found: ignore

      - name: Marketplace manifest path check
        shell: bash
        run: ./scripts/check-marketplace-paths.sh

      # `terraform validate` never reads a tfvars file, so the loop above cannot
      # tell that a root's terraform.tfvars.example still assigns every required
      # variable. This checks the documented copy-and-plan flow statically, with
      # no cloud credentials.
      - name: Operator tfvars example contract
        shell: bash
        run: ./scripts/check-tfvars-examples.sh

      # honua-iac#149 made remote state with locking a precondition of the AWS
      # release lane, so a root that ships no backend.tf.example cannot be
      # planned through the governed wrappers at all. Static, no credentials.
      - name: Operator backend example contract
        shell: bash
        run: ./scripts/check-backend-examples.sh

      - name: Backend example gate regression test (refusal rules)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/shared/test-backend-examples.sh

      # The aws-cert postgis-bootstrap Lambda applies the certification serving
      # fixture as one transaction, so its SQL splitter and sha256 verification
      # decide whether a 52 KB seed lands intact. Stdlib-only: no zip, no
      # database, no credentials. See examples/aws-cert/README.md.
      - name: PostGIS bootstrap unit tests (build, SQL splitter, script verification)
        shell: bash
        run: python3 -m unittest discover -s infrastructure/terraform/examples/aws-cert/postgis-bootstrap -p 'test_*.py'

      - name: Native EKS runtime binding output (mock providers only)
        shell: bash
        run: |
          set -euo pipefail
          native_tests="$RUNNER_TEMP/native-eks-tests.jsonl"
          if terraform -chdir=infrastructure/terraform/examples/aws-eks-native test -json -verbose -filter=tests/native_install.tftest.hcl > "$native_tests"; then
            node infrastructure/terraform/validation/scripts/shared/test-native-eks-runtime-binding-output.mjs "$native_tests"
          else
            node infrastructure/terraform/validation/scripts/shared/test-native-eks-runtime-binding-output.mjs "$native_tests" --diagnostics-only || true
            exit 1
          fi
          python3 -m unittest discover -s infrastructure/terraform/examples/aws-eks-native/tests -p 'test_*.py'

      - name: Runtime settings history omission fails closed (mock providers only)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/shared/test-runtime-settings-retention-omission.sh

      - name: Complete release-cell retirement boundaries (offline)
        run: |
          python3 -m unittest discover -s infrastructure/terraform/validation/scripts/aws -p test_serverless_cell_retirement.py
          python3 infrastructure/terraform/validation/scripts/shared/test-serverless-retirement-override.py

      - name: Module contract tests (multi-node topology, licensing mode)
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/terraform/bootstrap/aws-release-cells test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-validation-reaper test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-drift-plan test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-exec-identity test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-ecs test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-serverless test -no-color
          terraform -chdir=infrastructure/terraform/bootstrap/aws-eks test -no-color
          terraform -chdir=infrastructure/terraform/components/aws-github-oidc test -no-color
          terraform -chdir=infrastructure/terraform/modules/aws-ecs test -no-color
          # The output check counts exactly the deployment-safety scenarios, so the
          # root's other test files run separately.
          terraform -chdir=infrastructure/terraform/examples/aws test -json -verbose -filter=tests/deployment_safety.tftest.hcl > "$RUNNER_TEMP/aws-safety-tests.jsonl"
          node infrastructure/terraform/validation/scripts/shared/test-deployment-safety-output.mjs "$RUNNER_TEMP/aws-safety-tests.jsonl"
          terraform -chdir=infrastructure/terraform/examples/aws test -no-color -filter=tests/operations_policy_passthrough.tftest.hcl -filter=tests/http_redirect_passthrough.tftest.hcl -filter=tests/studio_end_user_authorization_passthrough.tftest.hcl -filter=tests/platform_release.tftest.hcl -filter=tests/transcript_signing.tftest.hcl -filter=tests/upgrade_safety_passthrough.tftest.hcl
          terraform -chdir=infrastructure/terraform/modules/aws-serverless test -no-color
          lambda_test_filters=()
          for test_file in infrastructure/terraform/examples/aws-serverless/tests/*.tftest.hcl; do
            [[ "${test_file##*/}" == "operator_contract.tftest.hcl" ]] && continue
            lambda_test_filters+=("-filter=tests/${test_file##*/}")
          done
          terraform -chdir=infrastructure/terraform/examples/aws-serverless test -no-color "${lambda_test_filters[@]}"
          lambda_tests="$RUNNER_TEMP/lambda-operator-tests.jsonl"
          if terraform -chdir=infrastructure/terraform/examples/aws-serverless test -json -verbose -filter=tests/operator_contract.tftest.hcl > "$lambda_tests"; then
            node infrastructure/terraform/validation/scripts/shared/test-lambda-operator-contract-output.mjs "$lambda_tests"
          else
            node infrastructure/terraform/validation/scripts/shared/test-lambda-operator-contract-output.mjs "$lambda_tests" --diagnostics-only || true
            exit 1
          fi
          terraform -chdir=infrastructure/terraform/examples/aws-cert test -no-color
          terraform -chdir=infrastructure/terraform/modules/aws-eks test -no-color
          terraform -chdir=infrastructure/terraform/examples/aws-eks test -no-color
          terraform -chdir=infrastructure/terraform/modules/azure-aca test -no-color
          terraform -chdir=infrastructure/terraform/modules/azure-functions test -no-color

      - name: Post-apply caller and named-evidence contract
        shell: bash
        run: python3 infrastructure/terraform/validation/scripts/shared/test-platform-post-apply-validation.py
      - name: Operator contract v1 fixtures and negative tests
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/shared/test-operator-contract.sh

      - name: Customer distribution tarball smoke test (terraform init each packaged example)
        shell: bash
        run: ./scripts/smoke-customer-dist.sh

  policy-gates:
    name: Terraform Policy Gates
    needs: static-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install checkov
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov==3.2.497

      - name: Policy-gate regression test (gate pass/fail logic)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/shared/test-terraform-policy-gate.sh

      # The infra reaper deletes live cloud resources, so its refusal rules are
      # the thing under test: run against a fake AWS + fake gh, no credentials,
      # no network. See #142.
      - name: Certification OIDC credential contract
        shell: bash
        run: python3 infrastructure/terraform/validation/scripts/shared/test-certification-oidc.py

      - name: Scheduled cleanup role precondition contract
        shell: bash
        run: python3 tests/workflows/test_cleanup_role_precondition.py

      - name: Bootstrap drift plan contract (root coverage, redacted report)
        shell: bash
        run: |
          python3 scripts/bootstrap-drift-roots.py --check
          python3 tests/workflows/test_bootstrap_drift_plan.py

      - name: Database pool sizing block is identical across modules
        shell: bash
        run: python3 tests/terraform/test_db_pool_sizing.py -v

      - name: Certification image pins and revision orchestration
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/aws/test-certification-images.sh

      - name: Live licensing-mode check regression test (Community fallback refusal)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/aws/test-licensing-mode-check.sh

      - name: Validation infra reaper regression test (refusal rules)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/aws/test-sweep-orphaned-validation-infra.sh

      # The exact-plan/apply wrappers decide whether a customer-account mutation
      # may start, so their fail-closed matrix is the thing under test. Runs
      # fully offline against a fake terraform and fixtures: no credentials, no
      # network, no real state. See honua-iac#149.
      - name: Governed execution substrate regression test (fail-closed matrix)
        shell: bash
        run: ./infrastructure/terraform/validation/scripts/shared/test-terraform-exact-plan.sh

      - name: Run Terraform policy gate script
        shell: bash
        env:
          HONUA_TERRAFORM_POLICY_STRICT: "true"
        run: ./infrastructure/terraform/validation/scripts/shared/terraform-policy-gate.sh
