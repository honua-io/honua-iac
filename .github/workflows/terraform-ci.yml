name: Terraform CI

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/examples/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'
  push:
    branches:
      - trunk
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/examples/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  HONUA_MAX_RUN_COST_USD: ${{ vars.HONUA_MAX_RUN_COST_USD || '100' }}
  HONUA_TERRAFORM_VALIDATION_RUNNER_PROJECT: infrastructure/terraform/validation/runner/Honua.Terraform.ValidationRunner/Honua.Terraform.ValidationRunner.csproj

jobs:
  static-validate:
    name: Static Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Terraform fmt check
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          terraform fmt -check -recursive docs/devops/examples

      - name: Terraform init/validate (selected roots)
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t roots < <(dotnet run --project "$HONUA_TERRAFORM_VALIDATION_RUNNER_PROJECT" -- roots static-validate --format lines)

          for root in "${roots[@]}"; do
            echo "::group::terraform init ($root)"
            terraform -chdir="$root" init -backend=false -input=false -no-color
            echo "::endgroup::"

            echo "::group::terraform validate ($root)"
            terraform -chdir="$root" validate -no-color
            echo "::endgroup::"
          done

      - name: Terraform native tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t test_roots < <(dotnet run --project "$HONUA_TERRAFORM_VALIDATION_RUNNER_PROJECT" -- roots native-tests --format lines)

          for root in "${test_roots[@]}"; do
            echo "::group::terraform test ($root)"
            terraform -chdir="$root" test -no-color
            echo "::endgroup::"
          done

  policy-gates:
    name: Terraform Policy Gates
    needs: static-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.200'

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install checkov
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov==3.2.497

      - name: Run Terraform policy gate script
        shell: bash
        env:
          HONUA_TERRAFORM_POLICY_STRICT: "true"
        run: ./infrastructure/terraform/validation/scripts/shared/terraform-policy-gate.sh
