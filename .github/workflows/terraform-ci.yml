name: Terraform CI

on:
  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/examples/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'
  push:
    branches:
      - trunk
    paths:
      - 'infrastructure/terraform/**'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/tf-secrets.local.example.sh'
      - 'docs/devops/terraform-validation.md'
      - 'docs/devops/examples/**'
      - '.github/workflows/terraform-ci.yml'
      - '.github/workflows/terraform-manual-validation.yml'

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: true
  HONUA_VALIDATION_GHA_VARS_JSON: ${{ toJSON(vars) }}

jobs:
  static-validate:
    name: Static Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run static validation via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            static-validate

  policy-gates:
    name: Terraform Policy Gates
    needs: static-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ripgrep
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install checkov
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install checkov==3.2.497

      - name: Run Terraform policy gates via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            policy-gates \
            --strict true
