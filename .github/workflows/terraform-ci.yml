  pull_request:
    paths:
      - 'infrastructure/terraform/**'
      - 'release/aws-cert-plan-recipient.json'
      - 'release/aws-cert-reviewed-modules.json'
      - 'release/aws-cert-reviewed-bootstrap.json'
      - 'release/component-versions.json'
      - 'scripts/run-aws-terraform-integration.sh'
      - 'scripts/run-azure-terraform-integration.sh'
      - 'scripts/run-aks-terraform-integration.sh'
      - 'scripts/run-eks-terraform-integration.sh'
      - 'scripts/run-k8s-terraform-integration.sh'
      - 'scripts/run-terraform-drift-detection.sh'
      - 'scripts/terraform-policy-gate.sh'
      - 'scripts/validate-operator-contract.sh'
      - 'scripts/test-operator-contract.sh'
      - 'scripts/check-marketplace-paths.sh'
      - 'scripts/check-tfvars-examples.sh'
