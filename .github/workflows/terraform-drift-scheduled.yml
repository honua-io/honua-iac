name: Scheduled Terraform Drift

on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

permissions:
  contents: read

concurrency:
  group: terraform-drift-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  HONUA_VALIDATION_GHA_VARS_JSON: ${{ toJSON(vars) }}

jobs:
  drift-detect:
    name: Terraform Drift Detection
    if: ${{ github.ref == 'refs/heads/trunk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_ADMIN_PASSWORD }}
      HONUA_DB_PASSWORD: ${{ secrets.HONUA_DB_PASSWORD }}
      HONUA_DRIFT_ROOTS: ${{ vars.HONUA_DRIFT_ROOTS || '' }}
      HONUA_DRIFT_VAR_FILES: ${{ vars.HONUA_DRIFT_VAR_FILES || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run drift detection via typed runner
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project infrastructure/terraform/validation/runner/Honua.TerraformValidation.Runner -- \
            drift \
            --cloud both

      - name: Upload drift artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/drift
          if-no-files-found: ignore
